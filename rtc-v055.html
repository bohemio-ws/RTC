const expandedLessons=[["La radio es seguridad, no conversación. Antes de hablar escucha la frecuencia, prepara el mensaje, pulsa PTT, habla con calma y suelta. La llamada identifica destinatario, aeronave, posición e intención. No interrumpas salvo prioridad justificada.","Ejemplo ficticio: «Aeródromo Norte tráfico, EC-RTC, plataforma, salida local». La autoinformación no concede autorizaciones.","Comprueba volumen, frecuencia, micrófono y auriculares. Si no entiendes, solicita repetición. Nunca confundas «recibido» con «autorizado»."],["Alfabeto OACI: Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.","La pista 06 apunta aproximadamente a 060 grados magnéticos; su opuesta es la 24. La pista 18 apunta a 180 y su opuesta es la 36. Practica cifras de pistas, QNH, altitud e indicativos sin invertir números.","No confundas la palabra OACI Whiskey con el nombre escrito de un punto real; consulta la denominación publicada."],["QNH: ajuste altimétrico con el que el altímetro en tierra indica aproximadamente la elevación del aeródromo. QFE: presión de un punto de referencia, donde el altímetro marcaría aproximadamente cero.","QDM: dirección magnética hacia una estación; QDR: marcación magnética desde ella; QTE: marcación verdadera desde una estación. No son autorizaciones de navegación. La referencia estándar es 1013,25 hPa para niveles de vuelo según los procedimientos de transición.","Altitud se refiere al nivel medio del mar; altura, a una referencia especificada. Repetir QNH 1013 cuando se ha comunicado 1017 es un error crítico."],["Para establecer comunicación di primero la estación llamada y después tu indicativo completo. Comunica solo lo necesario: posición, nivel cuando proceda, intención y petición.","Fraseología normalizada: AFIRMO, NEGATIVO, RECIBIDO, REPITA, CORRECCIÓN, ESPERE, según su significado y contexto. RECIBIDO no concede permiso. CORRECCIÓN anuncia la rectificación de un error.","Ejemplo ficticio: «Aeródromo Sur torre, EC-RTC, punto de espera pista dos cuatro, listo para salida». Esto no autoriza a entrar en pista."],["En aeródromo controlado la torre puede dar autorizaciones e instrucciones dentro de su competencia. AFIS facilita información, no autorizaciones ATC. En autoinformación los pilotos comparten posiciones e intenciones.","La falta de respuesta no significa que una pista esté libre. Consulta siempre espacio aéreo, AIP, VAC, NOTAM y procedimientos locales.","En nuestros escenarios la voz de la aplicación puede actuar como instructor. No interpretes un comentario didáctico como una autorización de torre."],["La secuencia habitual es preparación, llamada inicial, rodaje, punto de espera, entrada en pista y despegue. No todas las fases requieren la misma llamada en cada aeródromo.","En aeródromo controlado distingue instrucciones de rodaje, mantener posición, cruce, alineación y autorización de despegue. Debes comprender y colacionar los elementos exigidos. Estar listo no es estar autorizado.","Si recibes «mantenga posición, pista dos cuatro», no puedes responder «entrando en pista». El movimiento automático del avión en la pantalla no equivale a autorización real."],["Los tramos típicos del circuito son ascenso inicial, viento cruzado, viento en cola, base y final. El sentido del circuito, alturas y puntos se obtienen de los procedimientos aplicables.","En el simulador el avión vuela solo; tú observas y comunicas en el momento adecuado. «Viento en cola izquierda pista cero seis» solo corresponde si esa es la configuración del escenario.","No anuncies final si sigues en base. Motor y al aire o aproximación frustrada deben comunicarse conforme a la situación; una llamada no sustituye autorización cuando sea necesaria."],["Al abandonar el circuito identifica el punto, tu posición y el destino o intención. Rumbo es dirección del morro; derrota es trayectoria sobre el suelo, que puede variar por viento.","Un punto Whiskey del simulador es ficticio. En vuelo real solo utiliza puntos y frecuencias de documentación vigente. Cambiar de frecuencia depende del servicio y procedimiento.","Ejemplo ficticio: «Aeródromo Norte tráfico, EC-RTC, abandonando circuito por punto Whiskey, en ruta a Aeródromo Sur»."],["Colacionar es confirmar que una instrucción crítica se ha entendido exactamente, no repetir palabras al azar. Comprueba pista, rumbo, altitud, QNH, frecuencia y restricciones cuando proceda.","Si recibes pista 24 y respondes pista 06, la transmisión es incorrecta aunque menciones «pista» y tu indicativo. Si no entiendes un dato, solicita repetición. Si te equivocas, anuncia CORRECCIÓN.","Ejemplo: «Mantengo posición, pista dos cuatro, EC-RTC». La obligación de colacionar depende de la instrucción y las reglas SERA aplicables."],["Meteorología: viento, rachas, visibilidad, nubes y presión condicionan la operación. METAR describe observaciones y TAF pronostica cuando existe ese servicio.","El viento se expresa por la dirección de procedencia. No elijas una pista solo por el número: considera viento, obstáculos, servicio y procedimientos. QNH es presión para ajustar el altímetro, no altitud.","La radio no sustituye la decisión de no volar. Verifica información meteorológica oficial y los límites aplicables al vuelo VFR ULM."],["MAYDAY indica socorro: peligro grave e inminente que requiere ayuda inmediata. PAN PAN indica urgencia relativa a seguridad sin alcanzar necesariamente socorro. La situación manda.","En socorro, transmite si puedes MAYDAY tres veces, estación llamada, indicativo, naturaleza, posición, altitud, intención y ayuda necesaria. Prioriza siempre el control de la aeronave.","Ejemplo ficticio: «MAYDAY, MAYDAY, MAYDAY, Aeródromo Norte tráfico, EC-RTC, parada de motor, dos millas al oeste, aterrizaje forzoso». No inventes una posición."],["Ante fallo de radio comprueba alimentación, volumen, frecuencia, selección de audio y conexiones sin descuidar el vuelo. Las actuaciones dependen de espacio aéreo, reglas y circunstancias.","Las señales luminosas de torre dependen de color, fijo o destellos y si la aeronave está en tierra o vuelo. Nunca asumas que verde fijo y verde intermitente significan lo mismo. Consulta la tabla oficial SERA.","La ausencia de señal no es autorización. Estudia procedimientos actualizados de fallo de comunicaciones y el uso del transpondedor cuando proceda."],["Aprende por etapas: mensajes cortos, secuencias largas, emergencias, circuito, y examen completo A → B → A. Los cuatro aeródromos y sus pistas son ficticios.","En el examen el avión vuela automáticamente y el alumno gestiona la radio. Hay que evaluar cuándo transmite, qué dice, valores exactos y errores críticos, no solo palabras detectadas.","Tras cada prueba revisa errores y repite la fase difícil. Un 100 % de coincidencias textuales no certifica competencia RTC."]];
const lessons=[["Fundamentos y escucha","Quién habla, quién escucha, disciplina de frecuencia, escucha previa, pulsación PTT y comunicación breve.","Antes de hablar, escucha la frecuencia. Identifica destinatario, aeronave, posición e intención. Evita transmisiones superpuestas.","Escucha → piensa → pulsa PTT → habla con claridad → suelta → escucha."],["Alfabeto y números","Alfabeto OACI, números de pista, altitudes, horas, frecuencias y niveles.","Aprende Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu. La transmisión de números depende del contexto y de la fraseología aplicable.","Ejercicio: deletrea tu indicativo y lee una pista 06, una 24 y una 18."],["Códigos Q y altimetría","QNH, QFE, QNE (uso didáctico), QDM, QDR y referencias de presión.","QNH es el ajuste para indicar elevación sobre el nivel medio del mar en tierra. QFE refiere la presión del punto de referencia. QDM es rumbo magnético hacia una estación; QDR, marcación magnética desde ella. QNE se usa en enseñanza para la referencia estándar de 1013,25 hPa, aunque debe distinguirse de la terminología reglamentaria de niveles de vuelo.","Ejercicio: explica la diferencia entre QNH 1017 y una altitud de 2.500 pies."],["Fraseología y estructura","Indicativos, estación llamada, posición, intención, afirmaciones, negativas, repeticiones y correcciones.","Las expresiones normalizadas reducen ambigüedades. Usa AFIRMO/AFIRMATIVO según el contexto normativo y las fórmulas publicadas; no importes automáticamente la fraseología estadounidense. Evita palabras superfluas.","Ejemplo ficticio: «Aeródromo Norte tráfico, EC-RTC, plataforma, información de tráfico para salida local»."],["Servicios ATS y autoinformación","Diferencia entre control de aeródromo, AFIS y autoinformación.","Una torre puede expedir autorizaciones en su ámbito; AFIS proporciona información, no autorización de control. En autoinformación ningún otro piloto autoriza a despegar. Las operaciones dependen del espacio aéreo y procedimientos aplicables.","Ejercicio: decide quién puede autorizar la entrada en pista en cada escenario."],["Rodaje, espera y despegue","Comunicación inicial, rodaje, cruce de pistas, punto de espera, alineación, salida y colación.","En aeródromo controlado no sustituyas una autorización por una intención. Colaciona instrucciones críticas y confirma valores concretos. En autoinformación transmite posición e intención cuando corresponda y mantén vigilancia.","Ejercicio: comunica tu posición en punto de espera y distingue autorización de información."],["Circuito y llegada","Incorporación, viento en cola, base, final, toma, motor y al aire, frustrada y abandono.","La oportunidad de transmitir depende del tipo de servicio, tráfico y procedimiento local. El circuito ilustrado no sustituye una carta VAC ni instrucciones ATS.","Ejercicio: anuncia viento en cola, base y final con indicativo y pista del escenario."],["En ruta y cambio de frecuencia","Puntos de notificación, posición, rumbo, altitud, estimadas y transferencia.","Una comunicación de posición debe identificar inequívocamente el lugar y la situación. Las frecuencias y puntos de notificación reales deben consultarse en AIP/VAC y NOTAM. No uses frecuencias ficticias fuera del simulador.","Ejercicio: salida por punto Whisky ficticio hacia Aeródromo Sur."],["Colación y números críticos","Colación de pista, rumbo, altitud, QNH, frecuencias, instrucciones de espera y autorizaciones.","No basta con detectar la palabra «pista». Hay que cotejar el valor comunicado con el recibido y detectar contradicciones. Una colación incorrecta puede ser crítica.","Ejercicio: recibe pista 24 y QNH 1017; repite ambos valores sin alterarlos."],["Meteorología y seguridad","Viento, visibilidad, nubes, METAR/TAF, información aeronáutica, decisiones y tráfico.","Interpreta información meteorológica en su contexto y no confíes en datos inventados. Un escenario puede incluir viento cruzado o baja visibilidad simulados para practicar comunicaciones.","Ejercicio: solicita información meteorológica e identifica cambios relevantes."],["PAN PAN y MAYDAY","Urgencia, socorro, prioridades, naturaleza, posición, intenciones y ayuda requerida.","MAYDAY se reserva para socorro; PAN PAN para urgencia. La elección depende de la situación, no de memorizar una palabra. Comunica naturaleza del problema, posición, intenciones y ayuda necesaria según proceda.","Ejercicio: distingue pérdida parcial de potencia y parada de motor con aterrizaje forzoso."],["Fallo de comunicaciones y señales","Comprobación de radio, pérdida de comunicación, procedimientos aplicables y señales luminosas.","La respuesta depende del espacio aéreo, reglas de vuelo y circunstancias. Las señales luminosas de torre se estudian según destinatario (en vuelo o en tierra) y color/patrón; nunca se improvisa su significado.","Ejercicio: identifica qué información debes consultar antes de operar con fallo de radio."],["Práctica guiada y examen A → B → A","Del mensaje aislado al vuelo completo con dos aeródromos, pista y servicio diferentes.","La simulación avanza por fases; el alumno debe transmitir en el momento oportuno. La evaluación provisional por palabras no equivale a competencia aeronáutica certificada.","Ejercicio: completa Aeródromo Norte → Aeródromo Sur → Aeródromo Norte."]];
const lessonQuiz=[{"lesson":0,"q":"¿Qué haces antes de pulsar PTT?","options":["Escuchar la frecuencia y preparar el mensaje","Transmitir inmediatamente","Mantener PTT durante toda la maniobra"],"answer":0,"why":"Escuchar antes de transmitir reduce interferencias y permite comprender el tráfico."},{"lesson":1,"q":"¿Cómo se denomina la letra W en el alfabeto OACI?","options":["Washington","Whiskey","Whisky"],"answer":1,"why":"La palabra codificada OACI es Whiskey. El nombre de un punto publicado debe reproducirse tal como aparezca en la documentación."},{"lesson":2,"q":"Con QNH ajustado, en tierra el altímetro debería indicar aproximadamente…","options":["Cero pies","La elevación del aeródromo","Siempre 1013 pies"],"answer":1,"why":"QNH relaciona la indicación altimétrica con la elevación respecto al nivel medio del mar."},{"lesson":3,"q":"¿Qué dato debe identificar sin ambigüedad a quien transmite?","options":["Indicativo","Color de la aeronave","Marca del motor"],"answer":0,"why":"El indicativo identifica la aeronave; debe usarse de manera inteligible."},{"lesson":4,"q":"¿Quién puede emitir una autorización de control en el escenario correspondiente?","options":["Cualquier piloto en frecuencia","Una dependencia ATS con función de control","El servicio de autoinformación"],"answer":1,"why":"AFIS y autoinformación no equivalen a control de aeródromo."},{"lesson":5,"q":"Una instrucción de mantener posición ante una pista significa…","options":["Entrar en pista","Despegar cuando no haya tráfico","No entrar en pista hasta recibir lo que corresponda"],"answer":2,"why":"Mantener posición no es autorización para entrar ni despegar."},{"lesson":6,"q":"En el simulador, al pasar de viento en cola a base, ¿qué corresponde?","options":["Hablar siempre aunque interfieras","Observar fase, tráfico y procedimiento y transmitir cuando corresponda","Esperar hasta estar en plataforma"],"answer":1,"why":"El momento oportuno depende del servicio, del procedimiento y de la situación."},{"lesson":7,"q":"¿Dónde se comprueba la frecuencia real de un aeródromo?","options":["En la pantalla ficticia del simulador","En documentación aeronáutica vigente y NOTAM aplicables","En cualquier conversación de Internet"],"answer":1,"why":"La simulación no es fuente de datos operativos reales."},{"lesson":8,"q":"Recibes pista 24 y colacionas pista 06. ¿Qué sucede?","options":["Da igual si dices 'pista'","Es un error crítico de valor","Es correcto si el indicativo es bueno"],"answer":1,"why":"Los valores concretos de una colación deben coincidir."},{"lesson":9,"q":"¿Qué expresa el QNH?","options":["Ajuste altimétrico de presión","Rumbo magnético hacia una estación","Distancia hasta la pista"],"answer":0,"why":"QNH es una referencia de presión altimétrica, no un rumbo."},{"lesson":10,"q":"Una parada total de motor con aterrizaje forzoso inminente normalmente exige…","options":["Comunicación rutinaria","Señal de socorro MAYDAY si es posible transmitir","Una llamada de estacionamiento"],"answer":1,"why":"MAYDAY se utiliza ante peligro grave e inminente que requiere ayuda inmediata."},{"lesson":11,"q":"Una señal luminosa de torre debe interpretarse considerando…","options":["Solo su color","Color, patrón y si la aeronave está en tierra o en vuelo","Solo la pista en uso"],"answer":1,"why":"El significado depende de esos factores y debe estudiarse con la tabla oficial."},{"lesson":12,"q":"¿Qué recorrido exige el examen final integrado?","options":["A → B","A → B → A","Solo circuito en A"],"answer":1,"why":"La prueba comprende salida, travesía, llegada, nueva salida y regreso."}];

odel":"Aeródromo Norte tráfico, EC-RTC, abandonando circuito por punto Whisky, en ruta a Aeródromo Sur.","checks":[["Tráfico",["trafico"]],["Indicativo",["ec rtc","e c r t c","eco charlie romeo tango charlie","echo charlie romeo tango charlie"]],["Salida de circuito",["abandon"]],["Punto W",["whisky","whiskey","punto w"]]]},{"title":"PAN PAN por anomalía","lesson":10,"question":"Situación simulada: vibración anormal del motor, mantienes potencia y necesitas prioridad para regresar. Formula una llamada de urgencia indicando problema, posición e intención.","model":"PAN PAN, PAN PAN, PAN PAN, Aeródromo Sur torre, EC-RTC, vibración anormal de motor, dos millas al norte, solicito regreso inmediato.","checks":[["Urgencia",["pan pan","panpan"]],["Indicativo",["ec rtc","e c r t c","eco charlie romeo tango charlie","echo charlie romeo tango charlie"]],["Problema",["motor","vibracion"]],["Posición",["millas","norte"]],["Intención",["regreso","retorno","aterrizar"]]]},{"title":"MAYDAY por parada","lesson":10,"question":"Situación simulada: parada total de motor y aterrizaje forzoso inminente. Emite socorro, naturaleza, posición e intención.","model":"MAYDAY, MAYDAY, MAYDAY, Aeródromo Norte tráfico, EC-RTC, parada de motor, dos millas al oeste, aterrizaje forzoso inmediato.","checks":[["Socorro",["mayday","may day"]],["Indicativo",["ec rtc","e c r t c","eco charlie romeo tango charlie","echo charlie romeo tango charlie"]],["Naturaleza",["motor","parada"]],["Posición",["millas","oeste"]],["Intención",["forzoso","aterrizaje"]]]}];

function rtcContextCheck(name,text,words){
 const n=norm(text);
 if(name==="Indicativo")return recognizedCallsign(text);
 if(words.some(w=>n.includes(norm(w))))return true;
 if(name==="Estación y tráfico"||name==="Tráfico")return /\b(trafico|traficos)\b/.test(n)||/\b(?:aerodromo|era del|era de|aero del)\s+(?:norte|sur|este|oeste)\b/.test(n);
 if(name==="Intención")return /\b(salir|salgo|salida|despegar|despegue)\b/.test(n)&&/\b(local|vuelo|inmediata|inmediato)\b/.test(n);
 if(name==="Posición")return /\b(en|desde)\s+(?:la\s+)?plataforma\b/.test(n);
 return false;
}
function rtcCadenceFeedback(text){
 if(!rtcLastTiming||Date.now()-rtcLastTiming.at>120000)return '<p class="muted">Ritmo: sin medición de voz. El texto escrito no permite evaluar velocidad.</p>';
 const secs=rtcLastTiming.seconds,words=norm(text).split(" ").filter(Boolean).length;
 if(secs<1||words<2)return '<p class="muted">Ritmo: muestra demasiado breve para estimar.</p>';
 const wpm=Math.round(words*60/secs);
 let advice=wpm>160?"Posiblemente demasiado rápido: separa los grupos importantes y vuelve a transmitir.":wpm<75?"Posiblemente demasiado lento: procura una emisión continua y clara.":"Ritmo aproximado dentro de una banda orientativa; verifica que las pausas faciliten comprender los datos.";
 return '<p><b>Ritmo estimado: '+wpm+' palabras/min</b> ('+secs.toFixed(1)+' s de PTT). '+advice+'</p><p class="muted">Estimación basada en texto reconocido y duración del PTT, no análisis acústico. No evalúa volumen, tono ni pausas internas. No es una norma oficial ni afecta a la nota.</p>';
}
function rtcCorrectionInfo(text){
 const raw=String(text||""),parts=raw.split(/\bcorrecci[oó]n\b/i);
 if(parts.length<2)return {used:false,valid:true,effective:raw,message:""};
 const before=parts.slice(0,-1).join(" "),after=parts[parts.length-1].trim();
 if(!after)return {used:true,valid:false,effective:raw,message:"Has dicho CORRECCIÓN, pero falta indicar el dato correcto."};
 const a=norm(before),b=norm(after);
 const lastRunway=/\bpista\s+(?:\d{1,2}|(?:cero|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)(?:\s+(?:cero|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve))?)\b/g;
 const old=[...a.matchAll(lastRunway)],newRunway=[...b.matchAll(lastRunway)];
 // Solo se sustituye el último dato de pista si se ha expresado inequívocamente.
 if(old.length&&newRunway.length){
  const idx=old[old.length-1].index,match=old[old.length-1][0];
  const effective=a.slice(0,idx)+a.slice(idx+match.length)+" "+b;
  return {used:true,valid:true,effective,message:"CORRECCIÓN detectada: se considera la última pista comunicada. Verifica que el dato corregido sea el correcto."};
 }
 return {used:true,valid:true,effective:raw,message:"CORRECCIÓN detectada. Comprueba que el dato sustituido queda inequívoco; el motor no descarta automáticamente otros valores."};
}
function rtcPhraseIssues(t){
 const n=norm(t),issues=[];
 if(/\bafirmativo\b/.test(n))issues.push("En este entrenador de fraseología española: utiliza «AFIRMA», no «afirmativo».");
 if(/\broger\b/.test(n))issues.push("En este entrenador de fraseología española: evita «ROGER»; usa «AFIRMA» cuando corresponda, o una colación específica.");
 if(/\bnegativa\b/.test(n))issues.push("Para responder negativamente, utiliza «NEGATIVO».");
 return issues;
}
function drillCheck(text){
 const d=drills[drillIdx],interpreted=rtcEmergencyPhonetics(text),correction=rtcCorrectionInfo(interpreted),n=norm(correction.effective);
 if(!n||n==="la transcripcion aparecera aqui"||n==="escuchando"){ $("#feedback").innerHTML='<section class="card feedback"><h3>Sin comunicación reconocida</h3><p>El micrófono no ha entregado texto evaluable. No corresponde poner un 0 % ni registrar un intento.</p><p>Repite manteniendo pulsado PTT mientras hablas, o escribe tu mensaje en el cuadro de texto.</p></section>';return}
 const results=d.checks.map(([name,words])=>({name,ok:rtcContextCheck(name,correction.effective,words)})),hits=results.filter(x=>x.ok).length,coverage=Math.round(hits/results.length*100),issues=numberIssues(drillIdx,n),critical=issues.length>0,wrongPriority=(drillIdx===5&&/\bmayday\b/.test(n))||(drillIdx===6&&/\bpan pan\b/.test(n)&&!/\bmayday\b/.test(n));
 if(wrongPriority)issues.push("Prioridad incorrecta para la gravedad simulada.");
 issues.push(...rtcPhraseIssues(text));if(!correction.valid)issues.push(correction.message);
 const score=issues.length||wrongPriority?Math.min(coverage,49):coverage;
 drillAttempts[drillIdx]=(drillAttempts[drillIdx]||0)+1;drillResults.push({drill:drillIdx,score,text,issues});
 const note=issues.length?"No avances todavía: revisa los valores o la prioridad.":coverage===100?"Elementos detectados; no es una certificación de fraseología o aptitud RTC.":"Faltan elementos que conviene practicar antes de avanzar.";
 $("#feedback").innerHTML='<section class="card feedback"><h3>Cobertura detectada: '+coverage+' %</h3><p><b>Resultado didáctico: '+score+' %</b></p>'+results.map(x=>'<div class="line '+(x.ok?"good":"warn")+'">'+(x.ok?"✓ ":"○ ")+safe(x.name)+'</div>').join("")+issues.map(x=>'<div class="line bad">⚠ '+safe(x)+'</div>').join("")+(correction.used?'<p><b>'+safe(correction.message)+'</b></p>':'')+'<p>'+safe(note)+'</p>'+rtcCadenceFeedback(text)+'<div class="radio"><b>Modelo didáctico:</b><p>'+safe(d.model)+'</p></div><div class="choice"><button class="btn" id="listenModel">🔊 Escuchar modelo</button><button class="btn" id="retryDrill">Repetir</button><button class="btn primary" id="nextDrill">Siguiente →</button></div></section>';
 $("#listenModel").onclick=()=>say(d.model);$("#retryDrill").onclick=()=>drillShow(drillIdx);$("#nextDrill").onclick=()=>drillShow((drillIdx+1)%drills.length)
}

const rtcFoundations=[
["Principio técnico","La radiocomunicación utiliza ondas electromagnéticas y equipos emisores y receptores. Para operar se debe conocer el alcance y las limitaciones del enlace."],
["Convenio de comunicaciones","El alfabeto radiotelefónico y los designadores de pista permiten transmitir datos sin ambigüedades."],

["Fraseología y colación","Los términos normalizados expresan acciones distintas. Acusar recibo no equivale a una autorización ni reemplaza una colación exigible."],
["Servicios de tránsito aéreo","Control ATC, AFIS y autoinformación cumplen funciones distintas. Sus atribuciones no son intercambiables."],
["Protección de pista","Rodaje, entrada en pista, cruce y despegue son actuaciones distintas y requieren respetar las autorizaciones aplicables."],
["Procedimientos de aeródromo","Los tramos del circuito y las condiciones locales se consultan en las cartas y publicaciones vigentes."],
["Información aeronáutica","Los procedimientos permanentes y los cambios temporales deben contrastarse con las publicaciones oficiales vigentes."],
["Seguridad de la colación","La pista, la altitud, el QNH y las restricciones mal repetidas pueden cambiar el sentido operativo de una instrucción."],
["Información meteorológica","Observaciones y pronósticos son productos diferentes. Su lectura debe considerar hora, validez y limitaciones."],
["Socorro y urgencia","MAYDAY y PAN PAN tienen prioridades y significados diferentes. La prioridad del piloto es mantener el control de la aeronave."],
["Vigilancia y contingencias","Los códigos SSR y los modos de transpondedor tienen significados definidos; solo son aplicables cuando se dispone del equipo correspondiente."],
["Sistemas y comunicaciones","El espaciado de canales y la adaptación de antenas son conceptos técnicos distintos de las autorizaciones operativas."]
];
function bankFoundation(q){const f=rtcFoundations[q.lesson];return '<section class="card"><h3>📘 Fundamento de esta pregunta</h3><p><b>'+safe(f[0])+':</b> '+safe(f[1])+'</p><p><b>Razón de la respuesta:</b> '+safe(q.why)+'</p><p><b>Por qué no las otras opciones:</b> '+safe(q.contrast||'Las demás alternativas no se ajustan al concepto o procedimiento descrito.')+'</p><p><b>Origen del material:</b> '+safe(q.source)+' · Tema '+(q.lesson+1)+' de RTC Academy.</p><p class="muted">El origen identifica el documento o material didáctico, no una cita normativa específica. Verifica los procedimientos aplicables en AESA, SERA y AIP ENAIRE.</p></section>'}
function bankLibrary(){app.innerHTML='<div class="row"><button class="btn" id="back">← Banco de preguntas</button><span class="tag">BIBLIOTECA RAZONADA</span></div><section class="card"><h2>Explicación y fundamento · '+driveQuestionBank.length+' preguntas</h2><p>Consulta la respuesta, su razonamiento y el origen del material sin iniciar un examen. Las referencias son orientativas hasta completar la verificación individual.</p></section>'+driveQuestionBank.map((q,i)=>'<details class="lesson"><summary>'+(i+1)+'. '+safe(q.q)+'</summary><p><b>Respuesta correcta:</b> '+safe(q.options[q.answer])+'</p>'+bankFoundation(q)+'</details>').join('');$("#back").onclick=bankHome}
function bankHome(){app.innerHTML='<div class="row"><button class="btn" id="back">← Formación</button><span class="tag">BANCO DE PREGUNTAS</span></div><section class="card"><h2>Banco de preguntas RTC · '+driveQuestionBank.length+' preguntas revisadas</h2><p>Preguntas seleccionadas y adaptadas de los documentos de «Test Radiofonia» de Drive y preguntas didácticas RTC Academy. Cada respuesta tiene una explicación.</p><p class="warn">Banco didáctico en revisión; no constituye examen oficial ni garantiza aptitud. Se han excluido preguntas originales ambiguas o pendientes de comprobación.</p><label for="bankTopic">Tema para repasar</label><select id="bankTopic" style="width:100%;padding:12px;margin:8px 0"><option value="-1">Todos los temas</option>'+lessons.map((l,i)=>'<option value="'+i+'">'+(i+1)+'. '+safe(l[0])+'</option>').join("")+'</select><button class="btn primary" id="reviewStart">📖 TEST DE REPASO · Explicación inmediata</button><button class="btn" id="examStart">📝 TEST DE EVALUACIÓN · 20 preguntas</button><button class="btn" id="libraryStart">📘 EXPLICACIÓN Y FUNDAMENTO DE CADA PREGUNTA</button></section><section class="card"><p><b>Repaso:</b> sin penalización, se explica cada respuesta al contestar. <b>Evaluación:</b> 20 preguntas repartidas entre los temas, sin revelar soluciones hasta entregar; al final se muestran puntuación, aciertos y explicaciones.</p></section>';$("#back").onclick=training;$("#reviewStart").onclick=()=>bankStart("review",+$("#bankTopic").value);$("#examStart").onclick=()=>bankStart("exam",-1);$("#libraryStart").onclick=bankLibrary}
function bankShuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bankExamBalanced(pool,limit){const byTopic=Array.from({length:13},(_,i)=>pool.filter(q=>q.lesson===i));const result=[];while(result.length<limit&&byTopic.some(a=>a.length)){for(let i=0;i<byTopic.length&&result.length<limit;i++){if(byTopic[i].length)result.push(byTopic[i].pop())}}return bankShuffle(result)}
function bankStart(mode,topic){let pool=driveQuestionBank.filter(q=>topic<0||q.lesson===topic);pool=bankShuffle(pool);if(mode==="exam"){pool=bankExamBalanced(pool,20)}bankSession={mode,pool,idx:0,answers:[],submitted:false,topic};bankRender()}
function bankRender(){const st=bankSession,q=st.pool[st.idx];if(!q){bankResults();return}const answered=st.answers[st.idx],review=st.mode==="review";app.innerHTML='<div class="row"><button class="btn" id="back">← Salir</button><span class="tag">'+(review?'REPASO':'EVALUACIÓN')+' · '+(st.idx+1)+'/'+st.pool.length+'</span></div><section class="card"><div class="k">TEMA '+(q.lesson+1)+' · '+safe(q.source)+'</div><h2>'+safe(q.q)+'</h2><div id="bankOptions">'+q.options.map((o,j)=>'<button class="btn" data-pick="'+j+'" style="display:block;width:100%;text-align:left;margin:8px 0" '+(answered!==undefined?'disabled':'')+'>'+(answered===j?'● ':'○ ')+String.fromCharCode(65+j)+'. '+safe(o)+'</button>').join("")+'</div><div id="bankFeedback">'+(review&&answered!==undefined?bankExplanation(q,answered):'')+'</div><div class="row" style="margin-top:14px"><button class="btn" id="bankPrev" '+(st.idx===0?'disabled':'')+'>← Anterior</button><button class="btn primary" id="bankNext" '+(answered===undefined?'disabled':'')+'>'+(st.idx===st.pool.length-1?'Finalizar':'Siguiente →')+'</button></div></section>';$("#back").onclick=bankHome;$("#bankPrev").onclick=()=>{st.idx--;bankRender()};$("#bankNext").onclick=()=>{st.idx++;bankRender()};document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{if(st.answers[st.idx]===undefined){st.answers[st.idx]=+b.dataset.pick;bankRender()}})}
function bankExplanation(q,a){return '<div class="card feedback"><h3 class="'+(a===q.answer?'good':'warn')+'">'+(a===q.answer?'✓ Correcto':'✗ Incorrecto')+'</h3><p><b>Respuesta correcta:</b> '+safe(q.options[q.answer])+'</p>'+bankFoundation(q)+'</div>'}
function bankResults(){const st=bankSession,correct=st.pool.filter((q,i)=>st.answers[i]===q.answer).length,total=st.pool.length,pct=Math.round(100*correct/total);app.innerHTML='<div class="row"><button class="btn" id="back">← Banco de preguntas</button><span class="tag">RESULTADOS</span></div><section class="card"><h2>'+(st.mode==="review"?'Repaso terminado':'Evaluación terminada')+'</h2><p style="font-size:24px"><b>'+correct+' / '+total+' · '+pct+' %</b></p><p>Resultado didáctico, no calificación oficial. Revisa las explicaciones y repite los temas débiles.</p><p><b>Errores por tema:</b> '+(lessons.map((l,i)=>({name:l[0],wrong:st.pool.filter((q,j)=>q.lesson===i&&st.answers[j]!==q.answer).length})).filter(x=>x.wrong).map(x=>safe(x.name)+": "+x.wrong).join(" · ")||"Ninguno")+'</p><button class="btn primary" id="retry">Repetir test</button><button class="btn" id="retryWrong" '+(correct===total?'disabled':'')+'>Repasar mis errores ('+(total-correct)+')</button></section>'+st.pool.map((q,i)=>'<details class="lesson"><summary>'+(st.answers[i]===q.answer?'✓':'✗')+' '+(i+1)+'. '+safe(q.q)+'</summary><p><b>Tu respuesta:</b> '+safe(q.options[st.answers[i]]||'Sin responder')+'</p>'+bankExplanation(q,st.answers[i])+'</details>').join("");$("#back").onclick=bankHome;$("#retry").onclick=()=>bankStart(st.mode,st.topic);$("#retryWrong").onclick=()=>{const wrong=st.pool.filter((q,i)=>st.answers[i]!==q.answer);bankSession={mode:"review",pool:bankShuffle(wrong),idx:0,answers:[],topic:st.topic};bankRender()}}
function quizHome(){const completed=Object.keys(quizAnswers).length,correct=Object.values(quizAnswers).filter(x=>x.correct).length;app.innerHTML='<div class="row"><button class="btn" id="back">← Formación</button><span class="tag">AUTOEVALUACIÓN</span></div><section class="card"><h2>13 preguntas de comprensión</h2><p>Una pregunta por lección. Responde, consulta la explicación y vuelve a intentarlo. No es el examen oficial RTC.</p><p><b>Progreso:</b> '+completed+'/13 · <b>Aciertos actuales:</b> '+correct+'</p><div class="bar"><i style="width:'+Math.round(completed/13*100)+'%"></i></div></section>'+lessonQuiz.map((q,i)=>'<button class="btn" data-quiz="'+i+'" style="width:100%;text-align:left;margin:5px 0">'+(quizAnswers[i]?(quizAnswers[i].correct?"✓ ":"↻ "):"○ ")+(i+1)+'. '+safe(lessons[q.lesson][0])+'</button>').join("")+'<section class="card"><button class="btn" id="clearQuiz">Reiniciar evaluación</button></section>';$("#back").onclick=training;$("#clearQuiz").onclick=()=>{quizAnswers={};quizHome()};document.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>quizShow(+b.dataset.quiz))}
function quizShow(i){const q=lessonQuiz[i];app.innerHTML='<div class="row"><button class="btn" id="back">← Preguntas</button><span class="tag">LECCIÓN '+(q.lesson+1)+'</span></div><section class="card"><h2>'+safe(q.q)+'</h2><div id="quizOptions">'+q.options.map((opt,j)=>'<button class="btn" style="display:block;width:100%;text-align:left;margin:9px 0" data-answer="'+j+'">'+String.fromCharCode(65+j)+'. '+safe(opt)+'</button>').join("")+'</div><div id="quizFeedback"></div></section>';$("#back").onclick=quizHome;document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{const choice=+b.dataset.answer,correct=choice===q.answer;quizAnswers[i]={choice,correct};$("#quizOptions").innerHTML='';$("#quizFeedback").innerHTML='<div class="card feedback"><h3 class="'+(correct?"good":"warn")+'">'+(correct?"Respuesta correcta":"Respuesta a revisar")+'</h3><p>'+safe(q.why)+'</p><p><b>Respuesta:</b> '+safe(q.options[q.answer])+'</p><button class="btn primary" id="quizNext">'+(i<lessonQuiz.length-1?"Siguiente lección →":"Ver resultados")+'</button></div>';$("#quizNext").onclick=()=>i<lessonQuiz.length-1?quizShow(i+1):quizHome()})}

function targetField(){return st.leg===0?st.to:st.from}

function mapSVG(){const f=activeField(),p=phase(),idx=st.step;const coords={platform:[42,190],taxi:[95,183],hold:[118,175],lineup:[155,170],departure:[155,125],upwind:[155,68],crosswind:[222,56],downwind:[258,120],base:[258,185],final:[155,208],landing:[155,160],parking:[42,190],exit:[220,35],enroute:[280,42],arrival:[290,130],emergency:[250,70],divert:[220,80],approach:[155,207]};const xy=coords[p]||[155,130];const runwayAngle=f.heading-0;return '<svg class="map" viewBox="0 0 330 235" role="img" aria-label="Mapa esquemático de pista, circuito y posición de aeronave"><rect width="330" height="235" rx="10" fill="#102a3a"/><path d="M42 190 L95 183 L118 175 L155 170" fill="none" stroke="#d8c477" stroke-width="5"/><path d="M155 60 L258 60 L258 208 L155 208" fill="none" stroke="#51b8c7" stroke-dasharray="6 5" stroke-width="2"/><g transform="rotate('+runwayAngle+' 155 135)"><rect x="144" y="67" width="22" height="136" fill="#627681" stroke="#c8dce4"/><path d="M155 73 V195" stroke="#fff" stroke-width="2" stroke-dasharray="8 7"/></g><rect x="15" y="174" width="64" height="37" rx="5" fill="#255367"/><text x="47" y="190" text-anchor="middle" fill="white" font-size="10">Plataforma</text><text x="47" y="202" text-anchor="middle" fill="white" font-size="9">PARK</text><circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="14" fill="#eebc55" stroke="#fff" stroke-width="2"/><text x="'+xy[0]+'" y="'+(xy[1]+5)+'" text-anchor="middle" fill="#081523" font-size="16">✈</text><text x="10" y="20" fill="#d6ecf4" font-size="11">N ↑ · '+f.name+'</text><text x="10" y="32" fill="#bdd0d8" font-size="10">Pista '+f.rwy+' · esquema NO GEOGRÁFICO</text><text x="318" y="221" text-anchor="end" fill="#9bdfe8" font-size="11">Fase '+(idx+1)+'/'+st.steps.length+'</text></svg>'}
function draw(){if(st.step>=st.steps.length){if(st.mode==="exam"&&st.leg===0){st.leg=1;st.step=0;st.steps=route.slice();st.events.push("Etapa A → B terminada. Comienza regreso B → A.");draw();return}finish();return}const p=phase(),info=phases[p],f=activeField(),dest=targetField(),percent=Math.round(st.step/st.steps.length*100);st.waiting=true;st.transcript="";st.error="";app.innerHTML='<div class="row"><button class="btn" id="back">← Menú</button><span class="tag">'+safe(exercises.find(x=>x.id===st.mode).title)+'</span></div><section class="card"><div class="k">ESCENARIO FICTICIO · SOLO ENTRENAMIENTO</div><h2>'+safe(info[0])+'</h2><div class="row"><span>Origen: <b>'+safe(f.name)+'</b></span><span>Destino: <b>'+safe(dest.name)+'</b></span></div><p class="muted">Etapa '+(st.leg+1)+(st.mode==="exam"?"/2":"")+' · '+(st.step+1)+' de '+st.steps.length+'</p><div class="bar"><i style="width:'+percent+'%"></i></div><div style="margin-top:12px">'+mapSVG()+'</div><p>'+safe(info[1])+'</p><p class="muted">Servicio: '+safe(f.service)+' · Pistas '+f.rwy+' · Punto salida '+f.exit+' · Frecuencia FICTICIA '+f.freq+'</p></section><section class="card"><div class="k">TU TURNO DE RADIO</div><p>Observa la fase y transmite cuando corresponda. La estación de respuesta depende del servicio simulado.</p><button id="ptt" class="ptt">MANTENER<br>PTT</button><div id="status" class="muted">Pulsa PTT y habla; suelta al terminar.</div><div id="out" class="radio">La transcripción aparecerá aquí.</div><div class="choice"><button class="btn" id="manualBtn">⌨ Escribir</button><button class="btn" id="skip">Continuar sin transmitir</button></div><div id="manualArea"></div><div id="feedback"></div></section>';$("#back").onclick=()=>{try{st.rec?.abort()}catch{}menu()};$("#manualBtn").onclick=()=>{$("#manualArea").innerHTML='<textarea id="manualText" placeholder="Escribe la comunicación para probar el evaluador"></textarea><button class="btn primary" id="manualSend">Evaluar texto</button>';$("#manualSend").onclick=()=>evaluate($("#manualText").value)};$("#skip").onclick=()=>evaluate("",true);bindPTT()}
function slots(text){const n=norm(text),f=activeField();const vals={station:/\b(torre|control|informacion|radio|trafico|afis)\b/.test(n)||n.includes(norm(f.name)),callsign:recognizedCallsign(text),position:/\b(plataforma|rodaje|espera|pista|viento|cola|base|final|vertical|millas?|kilometros?|pies|norte|sur|este|oeste|whisky|punto|ascenso)\b/.test(n),intent:/\b(solicit|salid|despeg|aterr|incorpor|rodaj|abandon|notific|entr|continu|frustr|desvi|regres|dirig|proced|emerg|manten)\w*/.test(n),runway:/\b(pista|06|24|18|36|09|27|12|30|dos|seis|ocho|nueve|uno|tres|cero)\b/.test(n),signal:/\b(mayday|may day|pan pan|panpan)\b/.test(norm(rtcEmergencyPhonetics(text))),nature:/\b(motor|potencia|humo|fuego|combustible|averia|fallo|emergencia|problema)\b/.test(n)};return vals}
function evaluate(t,skipped=false){if(!st.waiting)return;st.waiting=false;try{st.rec?.stop()}catch{}const text=String(t).trim(),interpreted=rtcEmergencyPhonetics(text),correction=rtcCorrectionInfo(interpreted),need=phases[phase()][2],v=slots(correction.effective),missing=need.filter(k=>!v[k]),score=skipped?0:Math.round((need.length-missing.length)/need.length*100),critical=phase()==="emergency"&&!v.signal,station=activeField().service,phrase=text.toLowerCase();let notes=[];if(correction.used)notes.push(correction.message);if(!correction.valid)notes.push("La rectificación no está completa.");if(skipped)notes.push("No se ha transmitido en la fase solicitada.");if(missing.length)notes.push("Elementos no detectados: "+missing.map(k=>({station:"estación",callsign:"indicativo",position:"posición",intent:"intención",runway:"pista",signal:"prioridad",nature:"naturaleza de la incidencia"}[k])).join(", "));if(station==="AUTOINFO"&&/\b(autorizado|autorice|permiso concedido)\b/i.test(text))notes.push("Autoinformación: ninguna aeronave puede conceder autorización ATC.");if(phase()==="emergency"&&!v.signal)notes.push("CRÍTICO: debes decidir y comunicar la prioridad adecuada según la gravedad.");if(phase()==="hold"&&station.includes("TORRE")&&!/autoriz/i.test(text))notes.push("La autorización ATS es condición del escenario; no se presume por el mero avance visual.");notes.push(...rtcPhraseIssues(text));if(score===100)notes.push("Elementos detectados. Esto NO certifica exactitud de valores ni corrección normativa.");const reply=skipped?"No se ha recibido transmisión.":missing.length?"EC-RTC, revise: "+missing.map(k=>({station:"estación",callsign:"indicativo",position:"posición",intent:"intención",runway:"pista",signal:"prioridad",nature:"naturaleza de la incidencia"}[k])).join(", ")+".":station==="AUTOINFO"?"Tráfico simulado recibido. Continúe atento a las demás aeronaves.":"EC-RTC, recibido. Continúe con la siguiente fase simulada.";st.scores.push({leg:st.leg,phase:phase(),score,critical:critical||rtcPhraseIssues(text).length>0,text,notes});st.events.push("Etapa "+(st.leg+1)+" · "+phases[phase()][0]+": "+score+"%");$("#feedback").innerHTML='<div class="card feedback"><h3>Evaluación provisional: '+score+' %</h3><p>'+safe(text||"Sin transmisión")+'</p>'+notes.map(x=>'<div class="line">'+safe(x)+'</div>').join("")+'<div class="radio"><b>Respuesta simulada:</b> '+safe(reply)+'</div><div class="choice"><button class="btn" id="repeat">🔊 Escuchar</button><button class="btn primary" id="next">Continuar vuelo →</button></div></div>';$("#next").onclick=()=>{st.step++;draw()};$("#repeat").onclick=()=>say(reply);say(reply)}
function bindPTT(){
 const p=$("#ptt"),out=$("#out"),status=$("#status");
 let latest="";
 rtcHoldRecognizer(p,status,t=>{latest=t;out.textContent=rtcAviationTranscript(t)||"Escuchando…"},t=>{if(!st.waiting)return;if(t.trim())evaluate(t);else status.textContent="No se reconoció voz. Repite o escribe."});
}
function finish(){const avg=st.scores.length?Math.round(st.scores.reduce((a,b)=>a+b.score,0)/st.scores.length):0,crit=st.scores.filter(x=>x.critical).length,passed=avg>=85&&!crit;app.innerHTML='<section class="card"><div class="k">INFORME FINAL · '+safe(exercises.find(x=>x.id===st.mode).title)+'</div><h2>'+(passed?"Ejercicio completado":"Ejercicio para revisar")+'</h2><h2 class="'+(passed?"good":"warn")+'">'+avg+' %</h2><p>'+st.scores.length+' comunicaciones · '+crit+' omisiones críticas detectadas</p><p class="warn">Resultado didáctico provisional: el evaluador aún no certifica exactitud de QNH, pista, indicativo ni conformidad normativa completa.</p><h3>Historial de comunicaciones</h3>'+st.scores.map(x=>'<div class="line">Etapa '+(x.leg+1)+' · '+safe(phases[x.phase][0])+' · '+x.score+'%<br><small>'+safe(x.text||"Sin transmisión")+'</small></div>').join("")+'<button class="btn primary" id="restart">Nuevo ejercicio</button></section>';$("#restart").onclick=menu}
menu();
</script></body></html>
