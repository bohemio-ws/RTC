<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTC Academy v0.61</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}</style></head><body><iframe id="rtc" src="rtc-v059.html?v=061" allow="microphone"></iframe><script>
const f=document.getElementById('rtc');
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let r=null,text='',pressed=false;
[...d.querySelectorAll('header small')].forEach(x=>{if(x.textContent.includes('VERSIÓN'))x.textContent='VERSIÓN 0.61 · 20 OCT 2026 · EC-RTC'});
// Pronunciación aeronáutica española: QNH/altitudes naturales; resto de cifras operativas, dígito a dígito.
const digits=s=>String(s).split('').join(' ');
const natural={200:'doscientos',300:'trescientos',400:'cuatrocientos',500:'quinientos',600:'seiscientos',700:'setecientos',800:'ochocientos',900:'novecientos',1000:'mil'};
const qnh=n=>{n=+n;if(n>=1000&&n<1100){const r=n-1000;if(!r)return'mil';const tens=['','diez','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];const units=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];if(r<10)return'mil '+units[r];if(r===10)return'mil diez';if(r>10&&r<20){const x=['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];return'mil '+x[r-10]}const t=Math.floor(r/10),u=r%10;return'mil '+tens[t]+(u?' y '+units[u]:'')}return String(n)};
const oldSpeech=w.speechForAviation;
w.speechForAviation=function(t){let x=String(t||'');x=x.replace(/\bEC[\s\-–—.]*RTC\b/gi,'Eco, Charlie, Romeo, Tango, Charlie');x=x.replace(/\bQNH[\s:=-]*(\d{4})\b/gi,(_,v)=>'Q N H, '+qnh(v));x=x.replace(/\b(altitud|altura)[\s:=-]*(200|300|400|500|600|700|800|900|1000)(\s+pies)?\b/gi,(_,a,v,p)=>a+', '+(natural[v]||v)+(p||' pies'));x=x.replace(/\b(\d{4})\b/g,(m)=>digits(m));return oldSpeech?oldSpeech(x):x};
function begin(){if(pressed)return;pressed=true;text='';const p=d.querySelector('#ptt');if(p)p.classList.add('live');if(!SR){const s=d.querySelector('#status');if(s)s.textContent='● TRANSMITIENDO · suelta PTT para finalizar';return}try{r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;r.onresult=e=>{let final='',interim='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t+' '}text=(final+interim).trim();const a=d.querySelector('#drillText');if(a)a.value=text;const o=d.querySelector('#out');if(o)o.textContent=w.rtcAviationTranscript?w.rtcAviationTranscript(text):text};r.start()}catch(e){r=null}const s=d.querySelector('#status');if(s)s.textContent='● TRANSMITIENDO · suelta PTT para finalizar'}
function end(){if(!pressed)return;pressed=false;const p=d.querySelector('#ptt');if(p)p.classList.remove('live');if(r){try{r.stop()}catch(e){}r=null}setTimeout(()=>{const a=d.querySelector('#drillText'),b=d.querySelector('#checkDrill'),s=d.querySelector('#status');if(text&&a&&b){a.value=text;b.click();if(s)s.textContent='✓ PTT liberado · transmisión finalizada y evaluada.'}else if(s)s.textContent='PTT liberado · transmisión finalizada.'},500)}
// PTT real: siempre mantener para transmitir y soltar para cortar. Se neutraliza el antiguo modo alterno.
d.addEventListener('pointerdown',e=>{if(e.target?.id==='ptt'){e.preventDefault();const toggle=d.querySelector('#rtcPTTToggle');if(toggle)toggle.checked=false;begin()}},true);
d.addEventListener('pointerup',e=>{if(e.target?.id==='ptt'){e.preventDefault();end()}},true);
d.addEventListener('pointercancel',e=>{if(e.target?.id==='ptt')end()},true);
d.addEventListener('lostpointercapture',e=>{if(e.target?.id==='ptt')end()},true);
const obs=new MutationObserver(()=>{const toggle=d.querySelector('#rtcPTTToggle');if(toggle){toggle.checked=false;const lab=toggle.closest('label');if(lab)lab.style.display='none'}const box=d.querySelector('#rtcAudioControls');if(box){box.querySelectorAll('textarea,button').forEach(x=>x.style.display='none');const p=[...box.querySelectorAll('p')].find(x=>x.textContent.includes('transcrip'));if(p)p.textContent='El audio se conserva para revisión. La transcripción y evaluación se realizan automáticamente al soltar PTT.'}});obs.observe(d.body,{childList:true,subtree:true});
};
</script></body></html>
