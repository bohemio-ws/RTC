<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTC Academy v0.60</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}</style></head><body><iframe id="rtc" src="rtc-v059.html?v=060a" allow="microphone"></iframe><script>
const f=document.getElementById('rtc');
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let r=null,text='';
[...d.querySelectorAll('header small')].forEach(x=>{if(x.textContent.includes('VERSIÓN'))x.textContent='VERSIÓN 0.60 · 20 OCT 2026 · EC-RTC'});
// Pronunciación aeronáutica central: cualquier variante escrita del indicativo se habla en alfabeto OACI.
const baseSpeech=w.speechForAviation;
w.speechForAviation=function(t){let x=String(t||'').replace(/\bEC[\s\-–—.]*RTC\b/gi,'Echo, Charlie, Romeo, Tango, Charlie');return baseSpeech?baseSpeech(x):x};
function speakAviation(t,receive=false){if(!('speechSynthesis'in w))return;w.speechSynthesis.cancel();if(receive&&w.rtcStopNoise)w.rtcStopNoise();const u=new w.SpeechSynthesisUtterance(w.speechForAviation(t));u.lang='es-ES';u.rate=.84;u.pitch=1;const vs=w.speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase()==='es-es')||vs.find(x=>x.lang.startsWith('es'));if(v)u.voice=v;if(receive){u.onstart=()=>w.rtcStartNoise&&w.rtcStartNoise();u.onend=()=>w.rtcStopNoise&&w.rtcStopNoise();u.onerror=()=>w.rtcStopNoise&&w.rtcStopNoise()}w.speechSynthesis.speak(u)}
w.say=t=>speakAviation(t,false);w.rtcReceive=t=>speakAviation(t,true);
function begin(){if(!SR)return;text='';try{r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;r.onresult=e=>{let final='',interim='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t+' '}text=(final+interim).trim();const a=d.querySelector('#drillText');if(a)a.value=text;const o=d.querySelector('#out');if(o)o.textContent=w.rtcAviationTranscript?w.rtcAviationTranscript(text):text};r.start()}catch(e){r=null}}
function end(){if(!r)return;try{r.stop()}catch(e){}setTimeout(()=>{const a=d.querySelector('#drillText'),b=d.querySelector('#checkDrill');if(text&&a&&b){a.value=text;b.click();const s=d.querySelector('#status');if(s)s.textContent='✓ Transcripción automática recibida y evaluación realizada.'}},650)}
d.addEventListener('pointerdown',e=>{if(e.target?.id==='ptt'){const live=e.target.classList.contains('live');if(!live)begin();else end()}},true);
d.addEventListener('pointerup',e=>{if(e.target?.id==='ptt'&&!d.querySelector('#rtcPTTToggle')?.checked)end()},true);
const obs=new MutationObserver(()=>{const box=d.querySelector('#rtcAudioControls');if(box){box.querySelectorAll('textarea,button').forEach(x=>x.style.display='none');const p=[...box.querySelectorAll('p')].find(x=>x.textContent.includes('transcrip'));if(p)p.textContent='El audio se conserva para revisión. La transcripción y evaluación se realizan automáticamente.'}});obs.observe(d.body,{childList:true,subtree:true});
};
</script></body></html>
