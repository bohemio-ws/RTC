<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTC Academy v0.63</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#e9dfc9}</style></head><body><iframe id="rtc" src="rtc-v059.html?v=063" allow="microphone"></iframe><script>
const f=document.getElementById('rtc');
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let r=null,finalText='',interimText='',pressed=false,started=0,ending=false;
[...d.querySelectorAll('link[rel="stylesheet"]')].forEach(l=>{if(l.href.includes('rtc-academy-theme.css'))l.href='rtc-academy-theme.css?v=063'});
[...d.querySelectorAll('header small')].forEach(x=>{if(x.textContent.includes('VERSIÓN'))x.textContent='VERSIÓN 0.63 · 20 OCT 2026 · EC-RTC'});
function text(){return(finalText+' '+interimText).trim()}
function paint(){const t=text(),a=d.querySelector('#drillText'),o=d.querySelector('#out');if(a)a.value=t;if(o)o.textContent=t?(w.rtcAviationTranscript?w.rtcAviationTranscript(t):t):'Escuchando…'}
function evaluate(){if(!ending)return;ending=false;const t=text(),a=d.querySelector('#drillText'),b=d.querySelector('#checkDrill'),s=d.querySelector('#status');if(t&&a&&b){a.value=t;w.rtcLastTiming={seconds:Math.max(.1,(performance.now()-started)/1000),at:Date.now()};b.click();if(s)s.textContent='✓ Transcripción recibida y evaluación automática completada.'}else if(s)s.textContent='No se reconoció texto. Repite la transmisión; este intento no se puntúa.'}
function begin(){if(pressed)return;pressed=true;ending=false;started=performance.now();finalText='';interimText='';paint();const p=d.querySelector('#ptt'),s=d.querySelector('#status');if(p)p.classList.add('live');if(s)s.textContent='● ESCUCHANDO · habla y suelta PTT al terminar';if(!SR){if(s)s.textContent='Este navegador no ofrece reconocimiento de voz.';return}try{r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const q=e.results[i][0].transcript.trim();if(e.results[i].isFinal){finalText=(finalText+' '+q).trim();interimText=''}else interimText=q}paint()};r.onend=()=>{if(ending)setTimeout(evaluate,100)};r.onerror=e=>{if(e.error!=='aborted'&&e.error!=='no-speech'){const s=d.querySelector('#status');if(s)s.textContent='Reconocimiento de voz: '+e.error}if(ending)setTimeout(evaluate,100)};r.start()}catch(e){r=null;if(s)s.textContent='No se pudo iniciar el reconocimiento de voz.'}}
function end(){if(!pressed)return;pressed=false;ending=true;const p=d.querySelector('#ptt'),s=d.querySelector('#status');if(p)p.classList.remove('live');if(s)s.textContent='Procesando transcripción…';if(r){try{r.stop()}catch(e){setTimeout(evaluate,150)}setTimeout(()=>{if(ending)evaluate()},900)}else evaluate()}
// El núcleo antiguo usa MediaRecorder. Se neutraliza su PTT para que no compita con SpeechRecognition.
function neutralizeOldPTT(){const p=d.querySelector('#ptt');if(!p||p.dataset.rtc63)return;p.dataset.rtc63='1';const clone=p.cloneNode(true);p.replaceWith(clone);clone.addEventListener('pointerdown',e=>{e.preventDefault();try{clone.setPointerCapture(e.pointerId)}catch{};begin()});clone.addEventListener('pointerup',e=>{e.preventDefault();end()});clone.addEventListener('pointercancel',e=>{e.preventDefault();end()});clone.addEventListener('lostpointercapture',()=>end())}
const obs=new MutationObserver(()=>{neutralizeOldPTT();const box=d.querySelector('#rtcAudioControls');if(box)box.style.display='none';const s=d.querySelector('#status');if(s&&/Toca PTT|grabaci[oó]n/i.test(s.textContent))s.textContent='Mantén PTT para hablar y suelta para transcribir y evaluar.'});obs.observe(d.body,{childList:true,subtree:true});neutralizeOldPTT();
};
</script></body></html>
