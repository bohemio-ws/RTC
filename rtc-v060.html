<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTC Academy v0.62</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#e9dfc9}</style></head><body><iframe id="rtc" src="rtc-v059.html?v=062" allow="microphone"></iframe><script>
const f=document.getElementById('rtc');
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let r=null,finalText='',interimText='',pressed=false,started=0;
// Forzar el tema aeronáutico aprobado evitando caché antigua.
[...d.querySelectorAll('link[rel="stylesheet"]')].forEach(l=>{if(l.href.includes('rtc-academy-theme.css'))l.href='rtc-academy-theme.css?v=062'});
[...d.querySelectorAll('header small')].forEach(x=>{if(x.textContent.includes('VERSIÓN'))x.textContent='VERSIÓN 0.62 · 20 OCT 2026 · EC-RTC'});
const digits=s=>String(s).split('').join(' ');
const natural={200:'doscientos',300:'trescientos',400:'cuatrocientos',500:'quinientos',600:'seiscientos',700:'setecientos',800:'ochocientos',900:'novecientos',1000:'mil'};
function qnh(v){const n=+v;if(n===1013)return'mil trece';if(n===1017)return'mil diecisiete';if(n===1027)return'mil veintisiete';return String(n).replace(/^10(\d\d)$/,(_,x)=>'mil '+(+x))}
const baseSpeech=w.speechForAviation;
w.speechForAviation=function(t){let x=String(t||'');x=x.replace(/\bEC[\s\-–—.]*RTC\b/gi,'Eco, Charlie, Romeo, Tango, Charlie');x=x.replace(/\bQNH[\s:=-]*(\d{4})\b/gi,(_,v)=>'Q N H, '+qnh(v));x=x.replace(/\b(altitud|altura)\s*(?:de\s*)?(200|300|400|500|600|700|800|900|1000)\s*(pies)?\b/gi,(_,a,v)=>a+', '+natural[v]+' pies');x=x.replace(/\b(\d{4})\b/g,m=>digits(m));return baseSpeech?baseSpeech(x):x};
function paint(){const t=(finalText+' '+interimText).trim(),a=d.querySelector('#drillText'),o=d.querySelector('#out');if(a)a.value=t;if(o&&t)o.textContent=w.rtcAviationTranscript?w.rtcAviationTranscript(t):t}
function begin(){if(pressed)return;pressed=true;started=performance.now();finalText='';interimText='';const p=d.querySelector('#ptt'),s=d.querySelector('#status');if(p)p.classList.add('live');if(s)s.textContent='● TRANSMITIENDO · mantén pulsado PTT';if(!SR)return;try{r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;r.onresult=e=>{let nf='',ni='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(e.results[i].isFinal)nf+=(nf?' ':'')+t;else ni+=(ni?' ':'')+t}if(nf)finalText=(finalText+' '+nf).trim();interimText=ni;paint()};r.start()}catch(e){r=null}}
function finish(){const t=(finalText+' '+interimText).trim(),a=d.querySelector('#drillText'),b=d.querySelector('#checkDrill'),s=d.querySelector('#status');if(t&&a&&b){a.value=t;if(w.rtcLastTiming)w.rtcLastTiming={seconds:(performance.now()-started)/1000,at:Date.now()};b.click();if(s)s.textContent='✓ PTT liberado · transcripción y evaluación completadas.'}else if(s)s.textContent='PTT liberado · no se reconoció texto; no se puntúa este intento.'}
function end(){if(!pressed)return;pressed=false;const p=d.querySelector('#ptt');if(p)p.classList.remove('live');try{if(r)r.stop()}catch(e){}r=null;setTimeout(finish,700)}
d.addEventListener('pointerdown',e=>{if(e.target?.id==='ptt'){e.preventDefault();const t=d.querySelector('#rtcPTTToggle');if(t)t.checked=false;begin()}},true);
d.addEventListener('pointerup',e=>{if(e.target?.id==='ptt'){e.preventDefault();end()}},true);
d.addEventListener('pointercancel',e=>{if(e.target?.id==='ptt')end()},true);
const obs=new MutationObserver(()=>{const t=d.querySelector('#rtcPTTToggle');if(t){t.checked=false;const lab=t.closest('label');if(lab)lab.style.display='none'}const box=d.querySelector('#rtcAudioControls');if(box){box.querySelectorAll('textarea,button').forEach(x=>x.style.display='none');const p=[...box.querySelectorAll('p')].find(x=>/transcrip/i.test(x.textContent));if(p)p.textContent='El audio se conserva para revisión. Al soltar PTT se transcribe y evalúa automáticamente.'}});obs.observe(d.body,{childList:true,subtree:true});
};
</script></body></html>
