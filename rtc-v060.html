<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#293e49"><title>RTC Academy · PTT automático</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#e9dfc9}</style></head><body><iframe id="rtc" src="rtc-v059.html?core=065" allow="microphone"></iframe><script>
const f=document.getElementById('rtc');
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let r=null,finalText='',interimText='',ending=false,started=0,pressed=false;
[...d.querySelectorAll('header small')].forEach(x=>{if(x.textContent.includes('VERSIÓN'))x.textContent='VERSIÓN 0.65 · 20 OCT 2026 · EC-RTC'});
function cleanASR(t){return String(t||'').replace(/\b(?:umh|umm|mmm|eh+|em+)\b/gi,' ').replace(/\s+/g,' ').trim()}
function normalizeAviation(t){let x=cleanASR(t);x=x.replace(/\b(?:q\s*n\s*h|cu\s+ene\s+hache|que\s+ene\s+hache)\b/gi,'QNH');x=x.replace(/\bmil\s+(?:y\s+)?diecisiete\b/gi,'1017');x=x.replace(/\bmil\s+(?:y\s+)?veintisiete\b/gi,'1027');x=x.replace(/\bdos\s+mil\s+quinientos\b/gi,'2500');x=x.replace(/\bdos\s+cinco\s+cero\s+cero\b/gi,'2500');return x}
function current(){return normalizeAviation((finalText+' '+interimText).trim())}
function paint(){const text=current(),a=d.querySelector('#drillText'),o=d.querySelector('#out');if(a)a.value=text;if(o)o.textContent=text?(w.rtcAviationTranscript?w.rtcAviationTranscript(text):text):'Escuchando…'}
function begin(){if(pressed)return;pressed=true;ending=false;started=performance.now();finalText='';interimText='';const p=d.querySelector('#ptt'),s=d.querySelector('#status');if(p)p.classList.add('live');if(s)s.textContent='● TRANSMITIENDO · mantén PTT pulsado';if(!SR){if(s)s.textContent='Este navegador no ofrece transcripción automática.';return}try{r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;r.onresult=e=>{let nf='',ni='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(e.results[i].isFinal)nf+=(nf?' ':'')+t;else ni+=(ni?' ':'')+t}if(nf)finalText=(finalText+' '+nf).trim();interimText=ni;paint()};r.onerror=e=>{if(!['aborted','no-speech'].includes(e.error)){const s=d.querySelector('#status');if(s)s.textContent='Reconocimiento de voz: '+e.error}};r.start()}catch(e){r=null}}
function finish(){if(!pressed)return;pressed=false;ending=true;const p=d.querySelector('#ptt'),s=d.querySelector('#status');if(p)p.classList.remove('live');if(s)s.textContent='Procesando transcripción…';try{if(r)r.stop()}catch(e){}setTimeout(()=>{paint();const text=current(),a=d.querySelector('#drillText'),b=d.querySelector('#checkDrill');if(text&&a&&b){a.value=text;w.rtcLastTiming={seconds:Math.max(.1,(performance.now()-started)/1000),at:Date.now()};b.click();if(s)s.textContent='✓ PTT liberado · transcripción y evaluación completadas.'}else if(s)s.textContent='No se reconoció texto. No se puntúa el intento; vuelve a transmitir.';r=null;ending=false},900)}
function installPTT(){const old=d.querySelector('#ptt');if(!old||old.dataset.hold65)return;const p=old.cloneNode(true);p.dataset.hold65='1';old.replaceWith(p);const toggle=d.querySelector('#rtcPTTToggle');if(toggle){toggle.checked=false;const lab=toggle.closest('label');if(lab)lab.style.display='none'}p.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='mouse'&&e.button!==0)return;try{p.setPointerCapture(e.pointerId)}catch{};begin()});p.addEventListener('pointerup',e=>{e.preventDefault();finish()});p.addEventListener('pointercancel',e=>{e.preventDefault();finish()});p.addEventListener('lostpointercapture',()=>finish())}
const obs=new MutationObserver(()=>{installPTT();const toggle=d.querySelector('#rtcPTTToggle');if(toggle){toggle.checked=false;const lab=toggle.closest('label');if(lab)lab.style.display='none'}const box=d.querySelector('#rtcAudioControls');if(box)box.style.display='none';const s=d.querySelector('#status');if(s&&/Toca PTT|vuelve a tocar|modo alterno/i.test(s.textContent))s.textContent='Mantén PTT pulsado para hablar y suelta para finalizar.'});obs.observe(d.body,{childList:true,subtree:true});installPTT();
};
</script></body></html>
