<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#293e49"><title>RTC Academy · PTT automático</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#e9dfc9}</style></head><body><iframe id="rtc" src="rtc-v059.html?core=062" allow="microphone"></iframe><script>
const f=document.getElementById('rtc');
f.onload=()=>{const w=f.contentWindow,d=f.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let r=null,finalText='',interimText='',ending=false;
[...d.querySelectorAll('header small')].forEach(x=>{if(x.textContent.includes('VERSIÓN'))x.textContent='VERSIÓN 0.62 · 20 OCT 2026 · EC-RTC'});
const baseSpeech=w.speechForAviation;
w.speechForAviation=function(t){let x=String(t||'').replace(/\bEC[\s\-–—.]*RTC\b/gi,'Eco, Charlie, Romeo, Tango, Charlie');return baseSpeech?baseSpeech(x):x};
function speak(t,receive=false){if(!('speechSynthesis'in w))return;w.speechSynthesis.cancel();if(receive&&w.rtcStopNoise)w.rtcStopNoise();const u=new w.SpeechSynthesisUtterance(w.speechForAviation(t));u.lang='es-ES';u.rate=.84;u.pitch=1;const vs=w.speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase()==='es-es')||vs.find(x=>x.lang.startsWith('es'));if(v)u.voice=v;if(receive){u.onstart=()=>w.rtcStartNoise&&w.rtcStartNoise();u.onend=()=>w.rtcStopNoise&&w.rtcStopNoise();u.onerror=()=>w.rtcStopNoise&&w.rtcStopNoise()}w.speechSynthesis.speak(u)}
w.say=t=>speak(t,false);w.rtcReceive=t=>speak(t,true);
function paint(){const text=(finalText+' '+interimText).trim(),a=d.querySelector('#drillText'),o=d.querySelector('#out');if(a)a.value=text;if(o&&text)o.textContent=w.rtcAviationTranscript?w.rtcAviationTranscript(text):text}
function begin(){if(!SR){const s=d.querySelector('#status');if(s)s.textContent='Este navegador no ofrece transcripción automática.';return}ending=false;finalText='';interimText='';try{r=new SR();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;r.onresult=e=>{let fin='';let inter='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+' ';else inter+=t+' '}finalText=fin.trim();interimText=inter.trim();paint()};r.onerror=e=>{if(!['aborted','no-speech'].includes(e.error)){const s=d.querySelector('#status');if(s)s.textContent='Reconocimiento de voz: '+e.error}};r.start()}catch(e){r=null}}
function evaluate(){if(ending)return;ending=true;try{if(r)r.stop()}catch(e){}setTimeout(()=>{paint();const text=(finalText+' '+interimText).trim(),a=d.querySelector('#drillText'),b=d.querySelector('#checkDrill'),s=d.querySelector('#status');if(text&&a&&b){a.value=text;b.click();if(s)s.textContent='✓ Transcripción automática y evaluación completadas.'}else if(s)s.textContent='No se reconoció texto. No se puntúa el intento; vuelve a transmitir.';r=null;ending=false},850)}
d.addEventListener('pointerdown',e=>{if(e.target?.id==='ptt'&&!e.target.classList.contains('live'))begin()},true);
d.addEventListener('pointerup',e=>{if(e.target?.id==='ptt'&&!d.querySelector('#rtcPTTToggle')?.checked)evaluate()},true);
d.addEventListener('click',e=>{if(e.target?.id==='ptt'&&d.querySelector('#rtcPTTToggle')?.checked&&e.target.classList.contains('live'))evaluate()},true);
const obs=new MutationObserver(()=>{const box=d.querySelector('#rtcAudioControls');if(box){box.querySelectorAll('textarea,button').forEach(x=>x.style.display='none');const p=[...box.querySelectorAll('p')].find(x=>/transcrip/i.test(x.textContent));if(p)p.textContent='El audio se conserva para revisión. La transcripción y la evaluación se realizan automáticamente.'}});obs.observe(d.body,{childList:true,subtree:true});
};
</script></body></html>
