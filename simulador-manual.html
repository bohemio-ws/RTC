<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>RTC Academy · Manual interactivo</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10263c;--line:#34536c;--txt:#edf5fa;--dim:#b3c5d1;--red:#bd2631;--green:#6de0aa;--yellow:#f4c65c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.btn,select,textarea{font:inherit;color:var(--txt);background:#193852;border:1px solid #4b6d86;border-radius:10px;padding:12px}.btn{cursor:pointer}.primary{background:var(--red)}.ptt{display:block;margin:16px auto;border-radius:50%;width:150px;height:150px;border:6px solid #8b161f;background:#d6303b;color:white;font-size:20px;font-weight:800;touch-action:none}.ptt.live{box-shadow:0 0 0 12px #e13b3b33}.radio{padding:12px;background:#06101e;border:1px solid var(--line);border-radius:9px;margin:9px 0}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:#ff7777}.row,.grid{display:flex;gap:8px;flex-wrap:wrap}.row>*,.grid>*{flex:1}.tag{display:inline-block;background:#24455e;padding:5px 9px;border-radius:18px;font-size:12px}.module{min-width:250px;text-align:left}.bar{height:9px;background:#06101e;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#49b6c3}textarea{width:100%;min-height:80px}small{color:var(--dim)}</style></head><body><header><small>BOHEMIO 4 INFINITY · RTC ACADEMY</small><h1>Manual de Radiofonía · Academia interactiva</h1><p>Aprende, escucha, transmite, equivócate y vuelve a intentarlo. Rama de pruebas: no modifica el simulador publicado.</p></header><main id="app"></main><script src="rtc-manual-engine.js"></script><script>
'use strict';const app=document.querySelector('#app'),E=window.RTCManualEngine,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let state={turn:0,shortAuthorized:false,attempts:0,score:0,history:[]};
const scenarios=[
{id:'ptt',module:'disciplina',title:'Disciplina de frecuencia',prompt:'La frecuencia está libre. Establece contacto inicial con Torre usando el indicativo completo.',need:['station','callsign'],accept:'Eco Charlie Romeo Tango Charlie, adelante.',after:()=>state.shortAuthorized=true,teach:'El manual exige escuchar, pulsar PTT antes de hablar, mantenerlo durante el mensaje y soltarlo al terminar.'},
{id:'abreviado',module:'indicativos',title:'Ahora sí puedes abreviar',prompt:'Torre te ha llamado «Eco Tango Charlie». Responde utilizando el indicativo abreviado.',need:['callsign'],short:true,accept:'Eco Tango Charlie, recibido.',teach:'En primer contacto el distintivo va completo. En comunicaciones sucesivas puede abreviarse cuando ATC lo haya hecho y no exista confusión.'},
{id:'posicion',module:'contacto',title:'Estructura del mensaje',prompt:'Notifica tu posición e intención de salida.',need:['callsign','position','intent'],short:true,accept:'Eco Tango Charlie, recibido.',teach:'Estructura básica: estación llamada, estación que llama y mensaje.'},
{id:'pista',module:'colacion',title:'Colación crítica',prompt:'Torre: «Eco Tango Charlie, mantenga posición, pista tres cero». Colaciona.',need:['callsign','runway'],short:true,expectedRunway:'30',accept:'Eco Tango Charlie, correcto.',teach:'Una colación incorrecta debe ser corregida por el controlador con NEGATIVO seguido de la instrucción correcta.'},
{id:'qnh',module:'numeros',title:'QNH dígito a dígito',prompt:'Torre: «Eco Tango Charlie, QNH uno cero uno siete». Colaciona el QNH y tu indicativo.',need:['callsign','qnh'],short:true,expectedText:/\b(1017|uno cero uno siete)\b/,correct:'QNH uno cero uno siete.',accept:'Eco Tango Charlie, correcto.',teach:'El manual indica que QNH se transmite dígito a dígito.'},
{id:'radio',module:'legibilidad',title:'Verificación de radio',prompt:'Tienes dudas sobre la calidad de la radio. Solicita una verificación de radio.',need:['station','callsign','radioCheck'],short:true,radioCheck:true,teach:'La escala del manual va de 1 ilegible a 5 perfectamente legible y solo debe utilizarse cuando haya problemas de calidad.'},
{id:'mayday',module:'emergencia',title:'Emergencia',prompt:'Tu monomotor ha sufrido parada de motor. Controla el avión y transmite el mensaje de socorro con prioridad, indicativo, naturaleza, intención y posición.',need:['signal','callsign','nature','intent','position'],short:true,priority:'mayday',accept:'Eco Tango Charlie, MAYDAY recibido. Continúe con su intención.',teach:'MAYDAY se usa para peligro serio o inminente que requiere ayuda inmediata.'},
{id:'pan',module:'urgencia',title:'Urgencia',prompt:'Tienes pérdida parcial de potencia pero mantienes el vuelo. Declara urgencia e informa de naturaleza, intención y posición.',need:['signal','callsign','nature','intent','position'],short:true,priority:'pan',accept:'Eco Tango Charlie, PAN PAN recibido.',teach:'PAN PAN corresponde a una condición que afecta a la seguridad pero no exige ayuda inmediata.'}
];
function n(s){return E.norm(s)}function has30(t){return /\b(30|tres cero)\b/.test(n(t))}function wrongRunway(t){return /\b(12|uno dos|06|cero seis|24|dos cuatro|18|uno ocho|36|tres seis|09|cero nueve|27|dos siete)\b/.test(n(t))}
function menu(){app.innerHTML='<section class="card"><h2>18 módulos del manual</h2><p>El contenido completo del PDF se organiza como academia. Los módulos de teoría se convierten en retos cortos y los de fraseología en conversaciones.</p><div class="grid">'+E.modules.map((m,i)=>'<button class="btn module" data-m="'+m.id+'"><b>'+(i+1)+'. '+m.title+'</b><br><small>Páginas '+m.pages+' · '+m.game+'</small></button>').join('')+'</div></section><section class="card"><h2>🎙️ Circuito conversacional</h2><p>Prueba integrada de disciplina, indicativos, estructura, colación, QNH, legibilidad, MAYDAY y PAN PAN.</p><button class="btn primary" id="start">Empezar circuito</button></section>';document.querySelector('#start').onclick=()=>{state={turn:0,shortAuthorized:false,attempts:0,score:0,history:[]};render()};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>moduleInfo(b.dataset.m))}
function moduleInfo(id){const m=E.modules.find(x=>x.id===id);app.innerHTML='<section class="card"><span class="tag">Páginas '+m.pages+'</span><h2>'+m.title+'</h2><p>'+m.game+'</p><p class="warn">Este módulo se está construyendo desde el contenido del manual; no añadimos procedimientos externos como si pertenecieran al PDF.</p><button class="btn" id="back">← Volver a módulos</button></section>';document.querySelector('#back').onclick=menu}
function current(){return scenarios[state.turn]}
function render(){const s=current();if(!s){finish();return}app.innerHTML='<section class="card"><span class="tag">'+(state.turn+1)+' / '+scenarios.length+'</span><h2>'+s.title+'</h2><p>'+s.prompt+'</p><div class="bar"><i style="width:'+Math.round(state.turn/scenarios.length*100)+'%"></i></div><p><small>'+s.teach+'</small></p></section><section class="card"><button class="ptt" id="ptt">MANTENER<br>PTT</button><div id="status">Pulsa PTT, habla y suelta.</div><div class="radio" id="heard">Esperando transmisión…</div><div class="row"><button class="btn" id="write">⌨ Escribir</button><button class="btn" id="hearPrompt">🔊 Escuchar situación</button></div><div id="manual"></div><div id="feedback"></div></section>';document.querySelector('#write').onclick=()=>{document.querySelector('#manual').innerHTML='<textarea id="txt" placeholder="Escribe lo que transmitirías"></textarea><button class="btn primary" id="send">Evaluar</button>';document.querySelector('#send').onclick=()=>evaluate(document.querySelector('#txt').value)};document.querySelector('#hearPrompt').onclick=()=>say(s.prompt);bindPTT()}
function evaluate(text){const s=current();state.attempts++;let ctx={registration:'EC-RTC',shortAuthorized:!!s.short&&state.shortAuthorized,stationName:'Torre',callsignAddress:s.short?'Eco Tango Charlie':'Eco Charlie Romeo Tango Charlie',need:s.need,acceptReply:s.accept};if(s.expectedRunway&&wrongRunway(text)&&!has30(text)){ctx.readbackError=true;ctx.correctInstruction='Mantenga posición, pista tres cero.'}if(s.expectedText&&!s.expectedText.test(n(text))){ctx.readbackError=true;ctx.correctInstruction=s.correct}let r=E.assess(text,ctx);if(s.priority==='mayday'&&r.slots.pan&&!r.slots.mayday)r={...r,outcome:'NEGATIVE',advance:false,severity:'critical',reply:'NEGATIVO. Revise prioridad: la parada de motor descrita es una condición de peligro.'};if(s.priority==='pan'&&r.slots.mayday&&!r.slots.pan)r={...r,outcome:'CONFIRM',advance:false,severity:'warn',reply:'CONFIRME prioridad. El escenario describe urgencia sin peligro inmediato.'};if(s.radioCheck&&r.advance){const q=E.radioReadability();r.reply='Eco Tango Charlie, Torre, le recibo '+q+'.';r.readability=q}const cls=r.advance?'good':r.severity==='critical'?'bad':'warn';document.querySelector('#heard').textContent=text||'Sin transmisión';document.querySelector('#feedback').innerHTML='<div class="card"><h3 class="'+cls+'">'+r.outcome+'</h3><div class="radio"><b>Estación:</b> '+r.reply+'</div><p>'+(r.advance?'Comunicación comprendida.':'No se avanza: corrige o repite.')+'</p>'+(r.advance?'<button class="btn primary" id="next">Continuar →</button>':'<button class="btn" id="retry">Volver a transmitir</button>')+'</div>';say(r.reply);state.history.push({title:s.title,text,outcome:r.outcome});if(r.advance){state.score++;document.querySelector('#next').onclick=()=>{if(s.after)s.after();state.turn++;state.attempts=0;render()}}else document.querySelector('#retry').onclick=()=>{document.querySelector('#feedback').innerHTML='';document.querySelector('#status').textContent='La estación espera una nueva transmisión.'}}
function bindPTT(){const p=document.querySelector('#ptt'),status=document.querySelector('#status'),heard=document.querySelector('#heard');let rec=null,holding=false,finalText='';const start=async e=>{e.preventDefault();holding=true;p.classList.add('live');finalText='';heard.textContent='Escuchando…';try{if(!SR)throw Error('Reconocimiento de voz no disponible');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(x=>x.stop());if(!holding)return;rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=5;rec.onstart=()=>status.textContent='● TRANSMITIENDO';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript}heard.textContent=(finalText+interim).trim()||'Escuchando…'};rec.onerror=e=>status.textContent='Radio: '+e.error;rec.onend=()=>{p.classList.remove('live');const t=finalText.trim();if(t)evaluate(t);else{status.textContent='No se comprendió. Vuelve a transmitir.';say('Última estación, repita.')}};rec.start()}catch(err){p.classList.remove('live');status.textContent=err.message}};const stop=e=>{e.preventDefault();holding=false;p.classList.remove('live');try{rec&&rec.stop()}catch{}};p.addEventListener('pointerdown',start);p.addEventListener('pointerup',stop);p.addEventListener('pointercancel',stop)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.92;speechSynthesis.speak(u)}catch{}}
function finish(){app.innerHTML='<section class="card"><h2 class="good">Circuito completado</h2><p>'+state.score+' comunicaciones aceptadas. El objetivo no es memorizar frases, sino resolver correctamente cada intercambio.</p><button class="btn primary" id="again">Repetir</button><button class="btn" id="home">Ver los 18 módulos</button></section><section class="card"><h3>Historial</h3>'+state.history.map(x=>'<p><b>'+x.title+'</b> · '+x.outcome+'<br><small>'+x.text+'</small></p>').join('')+'</section>';document.querySelector('#again').onclick=()=>{state={turn:0,shortAuthorized:false,attempts:0,score:0,history:[]};render()};document.querySelector('#home').onclick=menu}
menu();</script></body></html>
