<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>RTC Academy · Laboratorio Manual</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10263c;--line:#34536c;--txt:#edf5fa;--dim:#b3c5d1;--red:#bd2631;--green:#6de0aa;--yellow:#f4c65c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif}header,main{max-width:860px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.btn,select,textarea{font:inherit;color:var(--txt);background:#193852;border:1px solid #4b6d86;border-radius:10px;padding:12px}.btn{cursor:pointer}.primary{background:var(--red)}.ptt{display:block;margin:16px auto;border-radius:50%;width:150px;height:150px;border:6px solid #8b161f;background:#d6303b;color:white;font-size:20px;font-weight:800;touch-action:none}.ptt.live{box-shadow:0 0 0 12px #e13b3b33}.radio{padding:12px;background:#06101e;border:1px solid var(--line);border-radius:9px;margin:9px 0}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:#ff7777}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.tag{display:inline-block;background:#24455e;padding:5px 9px;border-radius:18px;font-size:12px}textarea{width:100%;min-height:80px}</style></head><body><header><small>BOHEMIO 4 INFINITY · RTC ACADEMY</small><h1>Laboratorio del Manual de Radiofonía</h1><p>Rama de pruebas. La conversación solo avanza cuando la transmisión se comprende suficientemente.</p></header><main id="app"></main><script src="rtc-manual-engine.js"></script><script>
'use strict';const app=document.querySelector('#app'),E=window.RTCManualEngine,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let state={module:0,turn:0,shortAuthorized:false,attempts:0};
const scenarios=[
{id:'indicativos',title:'Indicativos',prompt:'Establece contacto inicial con Torre. Utiliza el indicativo completo.',need:['station','callsign'],ctx:{stationName:'Torre',callsignAddress:'Eco Charlie Romeo Tango Charlie'},accept:'Eco Charlie Romeo Tango Charlie, adelante.',after:()=>state.shortAuthorized=true},
{id:'abreviado',title:'Indicativo abreviado',prompt:'Torre ya te ha llamado «Eco Tango Charlie». Responde usando el indicativo abreviado.',need:['callsign'],short:true,accept:'Eco Tango Charlie, recibido.'},
{id:'posicion',title:'Posición e intención',prompt:'Notifica posición e intención de salida.',need:['callsign','position','intent'],short:true,accept:'Eco Tango Charlie, recibido.'},
{id:'pista',title:'Colación de pista',prompt:'Torre: «Eco Tango Charlie, mantenga posición, pista tres cero». Colaciona la instrucción.',need:['callsign','runway'],short:true,expectedRunway:'30',accept:'Eco Tango Charlie, colación correcta.'},
{id:'qnh',title:'QNH',prompt:'Torre: «Eco Tango Charlie, QNH uno cero uno siete». Colaciona el QNH.',need:['callsign','qnh'],short:true,accept:'Eco Tango Charlie, correcto.'},
{id:'mayday',title:'MAYDAY',prompt:'Has sufrido una pérdida grave de potencia. Declara socorro e informa de la naturaleza y posición.',need:['signal','callsign','nature','position'],short:true,accept:'Eco Tango Charlie, MAYDAY recibido.'},
{id:'pan',title:'PAN PAN',prompt:'Tienes una situación urgente sin peligro grave e inminente. Transmite la urgencia, naturaleza y posición.',need:['signal','callsign','nature','position'],short:true,accept:'Eco Tango Charlie, PAN PAN recibido.'}
];
function norm(s){return E.norm(s)}function number30(t){const n=norm(t);return /\b(30|tres cero|treinta)\b/.test(n)}function numberWrong(t){const n=norm(t);return /\b(12|uno dos|doce|06|cero seis|24|dos cuatro|18|uno ocho|36|tres seis|09|cero nueve|27|dos siete)\b/.test(n)}
function current(){return scenarios[state.turn]||null}
function render(){const s=current();if(!s){finish();return}app.innerHTML='<section class="card"><span class="tag">'+(state.turn+1)+' / '+scenarios.length+'</span><h2>'+s.title+'</h2><p>'+s.prompt+'</p><p class="warn">Intentos en esta comunicación: '+state.attempts+'</p></section><section class="card"><button class="ptt" id="ptt">MANTENER<br>PTT</button><div id="status">Pulsa PTT, habla y suelta.</div><div class="radio" id="heard">Esperando transmisión…</div><div class="row"><button class="btn" id="write">⌨ Escribir</button><button class="btn" id="hearPrompt">🔊 Escuchar situación</button></div><div id="manual"></div><div id="feedback"></div></section>';document.querySelector('#write').onclick=()=>{document.querySelector('#manual').innerHTML='<textarea id="txt" placeholder="Escribe exactamente lo que transmitirías"></textarea><button class="btn primary" id="send">Evaluar</button>';document.querySelector('#send').onclick=()=>evaluate(document.querySelector('#txt').value)};document.querySelector('#hearPrompt').onclick=()=>say(s.prompt);bindPTT()}
function evaluate(text){const s=current();state.attempts++;let ctx={registration:'EC-RTC',shortAuthorized:!!s.short&&state.shortAuthorized,stationName:'Torre',callsignAddress:s.short?'Eco Tango Charlie':'Eco Charlie Romeo Tango Charlie',need:s.need,acceptReply:s.accept};if(s.expectedRunway&&numberWrong(text)&&!number30(text)){ctx.readbackError=true;ctx.correctInstruction='Mantenga posición, pista tres cero.'}let r=E.assess(text,ctx);if(s.id==='mayday'&&r.slots.pan&&!r.slots.mayday){r={...r,outcome:'NEGATIVE',advance:false,severity:'critical',reply:'NEGATIVO. La situación descrita es de socorro: revise la prioridad MAYDAY.'}}if(s.id==='pan'&&r.slots.mayday&&!r.slots.pan){r={...r,outcome:'CONFIRM',advance:false,severity:'warn',reply:'CONFIRME prioridad. El escenario describe urgencia sin peligro grave e inminente.'}}const cls=r.advance?'good':r.severity==='critical'?'bad':'warn';document.querySelector('#heard').textContent=text||'Sin transmisión';document.querySelector('#feedback').innerHTML='<div class="card"><h3 class="'+cls+'">'+r.outcome+'</h3><div class="radio"><b>Estación:</b> '+r.reply+'</div><p>'+(r.advance?'Comunicación suficientemente comprendida. Puedes continuar.':'No se avanza. Corrige o repite la transmisión.')+'</p>'+(r.advance?'<button class="btn primary" id="next">Continuar →</button>':'<button class="btn" id="retry">Repetir transmisión</button>')+'</div>';say(r.reply);if(r.advance){document.querySelector('#next').onclick=()=>{if(s.after)s.after();state.turn++;state.attempts=0;render()}}else document.querySelector('#retry').onclick=()=>{document.querySelector('#feedback').innerHTML='';document.querySelector('#status').textContent='Torre espera una nueva transmisión.'}}
function bindPTT(){const p=document.querySelector('#ptt'),status=document.querySelector('#status'),heard=document.querySelector('#heard');let rec=null,holding=false,finalText='';const start=async e=>{e.preventDefault();holding=true;p.classList.add('live');finalText='';heard.textContent='Escuchando…';try{if(!SR)throw Error('Reconocimiento de voz no disponible');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(x=>x.stop());if(!holding)return;rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;rec.onstart=()=>status.textContent='● TRANSMITIENDO';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript}heard.textContent=(finalText+interim).trim()||'Escuchando…'};rec.onerror=e=>status.textContent='Radio: '+e.error;rec.onend=()=>{p.classList.remove('live');status.textContent='Transmisión terminada.';const t=finalText.trim();if(t)evaluate(t);else{status.textContent='No se comprendió la transmisión. Vuelve a intentarlo.';say('Última estación, repita.')}};rec.start()}catch(err){p.classList.remove('live');status.textContent=err.message}};const stop=e=>{e.preventDefault();holding=false;p.classList.remove('live');try{rec&&rec.stop()}catch{}};p.addEventListener('pointerdown',start);p.addEventListener('pointerup',stop);p.addEventListener('pointercancel',stop)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.92;speechSynthesis.speak(u)}catch{}}
function finish(){app.innerHTML='<section class="card"><h2 class="good">Bloque completado</h2><p>Has terminado el primer circuito conversacional del manual.</p><button class="btn primary" id="again">Repetir entrenamiento</button></section><section class="card"><h3>Mapa completo previsto</h3>'+E.modules.map((m,i)=>'<p><b>'+(i+1)+'. '+m.title+'</b> · páginas '+m.pages+'<br><small>'+m.game+'</small></p>').join('')+'</section>';document.querySelector('#again').onclick=()=>{state={module:0,turn:0,shortAuthorized:false,attempts:0};render()}}
render();
</script></body></html>
