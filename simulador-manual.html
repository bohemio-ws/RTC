<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>RTC Academy · Manual interactivo</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10263c;--line:#34536c;--txt:#edf5fa;--dim:#b3c5d1;--red:#bd2631;--green:#6de0aa;--yellow:#f4c65c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif}header,main{max-width:920px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.btn,textarea{font:inherit;color:var(--txt);background:#193852;border:1px solid #4b6d86;border-radius:10px;padding:12px}.btn{cursor:pointer}.primary{background:var(--red)}.ptt{display:block;margin:16px auto;border-radius:50%;width:150px;height:150px;border:6px solid #8b161f;background:#d6303b;color:white;font-size:20px;font-weight:800;touch-action:none}.ptt.live{box-shadow:0 0 0 12px #e13b3b33}.radio{padding:12px;background:#06101e;border:1px solid var(--line);border-radius:9px;margin:9px 0}.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:#ff7777}.row,.grid{display:flex;gap:8px;flex-wrap:wrap}.row>*,.grid>*{flex:1}.tag{display:inline-block;background:#24455e;padding:5px 9px;border-radius:18px;font-size:12px}.module{min-width:250px;text-align:left}.bar{height:9px;background:#06101e;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#49b6c3}textarea{width:100%;min-height:80px}small{color:var(--dim)}</style></head><body><header><small>BOHEMIO 4 INFINITY · RTC ACADEMY</small><h1>Manual de Radiofonía · Academia interactiva</h1><p>Aprende, escucha, transmite, equivócate y vuelve a intentarlo. Rama de pruebas.</p></header><main id="app"></main><script src="rtc-manual-engine.js"></script><script>
'use strict';const app=document.querySelector('#app'),E=window.RTCManualEngine,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let state={turn:0,shortAuthorized:false,attempts:0,score:0,errors:0,history:[]};
const scenarios=[
{id:'ptt',title:'Disciplina de frecuencia',prompt:'La frecuencia está libre. Establece contacto inicial con Torre usando el indicativo completo.',need:['station','callsign'],accept:'Echo Charlie Romeo Tango Charlie, adelante.',after:()=>state.shortAuthorized=true,teach:'Escucha antes de transmitir. Primer contacto: indicativo completo.'},
{id:'abreviado',title:'Indicativo abreviado',prompt:'Torre ya te ha llamado «Echo Tango Charlie». Responde utilizando el indicativo abreviado.',need:['callsign'],short:true,accept:'Echo Tango Charlie, recibido.',teach:'Solo se abrevia cuando la estación ya lo ha hecho y no existe confusión.'},
{id:'posicion',title:'Posición e intención',prompt:'Notifica tu posición e intención de salida.',need:['callsign','position','intent'],short:true,accept:'Echo Tango Charlie, recibido.',teach:'Mensaje claro: quién eres, dónde estás y qué solicitas o vas a hacer.'},
{id:'pista',title:'Colación de pista',prompt:'Torre: «Echo Tango Charlie, mantenga posición, pista tres cero». Colaciona.',need:['callsign','runway'],short:true,expected:{runway:'30'},correct:'Mantenga posición, pista tres cero.',accept:'Echo Tango Charlie, correcto.',teach:'La pista es un elemento crítico. Un valor incorrecto provoca NEGATIVO.'},
{id:'qnh',title:'QNH',prompt:'Torre: «Echo Tango Charlie, QNH uno cero uno siete». Colaciona QNH e indicativo.',need:['callsign','qnh'],short:true,expected:{qnh:'1017'},correct:'QNH uno cero uno siete.',accept:'Echo Tango Charlie, correcto.',teach:'QNH se transmite dígito a dígito.'},
{id:'rumbo',title:'Rumbo',prompt:'Torre: «Echo Tango Charlie, rumbo cero nueve cero». Colaciona rumbo e indicativo.',need:['callsign','heading'],short:true,expected:{heading:'090'},correct:'Rumbo cero nueve cero.',accept:'Echo Tango Charlie, correcto.',teach:'Los rumbos se transmiten con tres cifras, incluidos ceros iniciales.'},
{id:'frecuencia',title:'Cambio de frecuencia',prompt:'Torre: «Echo Tango Charlie, llame en uno dos uno coma cinco». Colaciona la frecuencia y tu indicativo.',need:['callsign','frequency'],short:true,expected:{frequency:'121.5'},correct:'Frecuencia uno dos uno coma cinco.',accept:'Echo Tango Charlie, correcto.',teach:'En español el separador se pronuncia COMA.'},
{id:'radio',title:'Verificación de radio',prompt:'Tienes dudas sobre la recepción. Solicita una verificación de radio a Torre.',need:['station','callsign','radioCheck'],short:true,radioCheck:true,teach:'La escala de legibilidad es 1 a 5.'},
{id:'correccion',title:'CORRECCIÓN',prompt:'Has transmitido por error «pista dos ocho» pero querías decir «pista tres cero». Corrige tu propia transmisión.',need:['callsign','correction','runway'],short:true,expected:{runway:'30'},correct:'CORRECCIÓN, pista tres cero.',accept:'Echo Tango Charlie, recibido.',teach:'Si te equivocas durante una transmisión utiliza CORRECCIÓN y proporciona el dato correcto.'},
{id:'squawk',title:'Transpondedor',prompt:'Torre: «Echo Tango Charlie, transpondedor siete siete cero cero». Colaciona código e indicativo.',need:['callsign','squawk'],short:true,expected:{squawk:'7700'},correct:'Transpondedor siete siete cero cero.',accept:'Echo Tango Charlie, correcto.',teach:'El manual relaciona 7700 con emergencia y 7600 con fallo de radio.'},
{id:'mayday',title:'MAYDAY',prompt:'Parada de motor. Controla el avión y transmite socorro: MAYDAY tres veces, estación, indicativo, naturaleza, intención y posición.',need:['signal','station','callsign','nature','intent','position'],short:true,priority:'mayday',signalMin:3,accept:'Echo Tango Charlie, MAYDAY recibido. Continúe con su intención.',teach:'Socorro: prioridad absoluta. Aviación primero, radio después.'},
{id:'pan',title:'PAN PAN',prompt:'Pérdida parcial de potencia, mantienes vuelo. Transmite PAN PAN tres veces, estación, indicativo, naturaleza, intención y posición.',need:['signal','station','callsign','nature','intent','position'],short:true,priority:'pan',signalMin:3,accept:'Echo Tango Charlie, PAN PAN recibido.',teach:'Urgencia tiene prioridad sobre el resto salvo socorro.'}
];
function countPriority(t,type){const n=E.norm(t);if(type==='mayday')return (n.match(/\bmayday\b/g)||[]).length;if(type==='pan')return Math.floor((n.match(/\bpan\b/g)||[]).length/2);return 0}function current(){return scenarios[state.turn]}
function menu(){app.innerHTML='<section class="card"><h2>18 módulos del manual</h2><div class="grid">'+E.modules.map((m,i)=>'<button class="btn module" data-m="'+m.id+'"><b>'+(i+1)+'. '+m.title+'</b><br><small>Páginas '+m.pages+' · '+m.game+'</small></button>').join('')+'</div></section><section class="card"><h2>🎙️ Circuito práctico</h2><p>12 comunicaciones encadenadas. No se avanza hasta resolver cada intercambio.</p><button class="btn primary" id="start">Empezar circuito</button></section>';document.querySelector('#start').onclick=()=>{state={turn:0,shortAuthorized:false,attempts:0,score:0,errors:0,history:[]};render()};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>moduleInfo(b.dataset.m))}
function moduleInfo(id){const m=E.modules.find(x=>x.id===id);app.innerHTML='<section class="card"><span class="tag">Páginas '+m.pages+'</span><h2>'+m.title+'</h2><p>'+m.game+'</p><p><small>Contenido estructurado desde el manual. Los datos regulatorios históricos del PDF se mantienen identificados como material del manual.</small></p><button class="btn" id="back">← Volver</button></section>';document.querySelector('#back').onclick=menu}
function render(){const s=current();if(!s){finish();return}app.innerHTML='<section class="card"><span class="tag">'+(state.turn+1)+' / '+scenarios.length+'</span><h2>'+s.title+'</h2><p>'+s.prompt+'</p><div class="bar"><i style="width:'+Math.round(state.turn/scenarios.length*100)+'%"></i></div><p><small>'+s.teach+'</small></p></section><section class="card"><button class="ptt" id="ptt">MANTENER<br>PTT</button><div id="status">Pulsa PTT, habla y suelta.</div><div class="radio" id="heard">Esperando transmisión…</div><div class="row"><button class="btn" id="write">⌨ Escribir</button><button class="btn" id="hearPrompt">🔊 Escuchar situación</button></div><div id="manual"></div><div id="feedback"></div></section>';document.querySelector('#write').onclick=()=>{document.querySelector('#manual').innerHTML='<textarea id="txt" placeholder="Escribe lo que transmitirías"></textarea><button class="btn primary" id="send">Evaluar</button>';document.querySelector('#send').onclick=()=>evaluate([document.querySelector('#txt').value])};document.querySelector('#hearPrompt').onclick=()=>say(s.prompt);bindPTT()}
function evaluate(alts){const s=current();state.attempts++;let best=null,bestText='';for(const text of alts){let ctx={registration:'EC-RTC',shortAuthorized:!!s.short&&state.shortAuthorized,stationName:'Torre',callsignAddress:s.short?'Echo Tango Charlie':'Echo Charlie Romeo Tango Charlie',need:s.need,expected:s.expected||{},correctInstruction:s.correct,acceptReply:s.accept};let r=E.assess(text,ctx);if(s.priority==='mayday'&&r.slots.pan&&!r.slots.mayday)r={...r,outcome:'NEGATIVE',advance:false,severity:'critical',reply:'NEGATIVO. Revise prioridad: esta situación es de socorro.'};if(s.priority==='pan'&&r.slots.mayday&&!r.slots.pan)r={...r,outcome:'CONFIRM',advance:false,severity:'warn',reply:'CONFIRME prioridad. El escenario describe urgencia.'};if(!best||r.advance||r.ratio>(best.ratio||0)){best=r;bestText=text;if(r.advance)break}}let r=best;if(r.advance&&s.signalMin&&countPriority(bestText,s.priority)<s.signalMin)r.styleWarnings=[...(r.styleWarnings||[]),'Fraseología: la señal '+s.priority.toUpperCase()+' debe repetirse tres veces. El reconocimiento de voz puede condensar repeticiones; no se bloquea el ejercicio.'];if(s.radioCheck&&r.advance){const q=E.radioReadability();r.reply='Echo Tango Charlie, Torre, le recibo '+q+'.';r.readability=q}if(!r.advance)state.errors++;else state.score++;state.history.push({title:s.title,text:bestText,outcome:r.outcome,attempt:state.attempts,warnings:r.styleWarnings||[]});const cls=r.advance?'good':r.severity==='critical'?'bad':'warn',warnings=(r.styleWarnings||[]).map(w=>'<p class="warn">⚠ '+w+'</p>').join('');document.querySelector('#heard').textContent=bestText||'Sin transmisión';document.querySelector('#feedback').innerHTML='<div class="card"><h3 class="'+cls+'">'+r.outcome+'</h3><div class="radio"><b>Estación:</b> '+r.reply+'</div>'+warnings+'<p>'+(r.advance?'Comunicación comprendida.':'No se avanza. Corrige únicamente lo necesario y vuelve a transmitir.')+'</p>'+(r.advance?'<button class="btn primary" id="next">Continuar →</button>':'<button class="btn" id="retry">Volver a transmitir</button>')+'</div>';say(r.reply);if(r.advance)document.querySelector('#next').onclick=()=>{if(s.after)s.after();state.turn++;state.attempts=0;render()};else document.querySelector('#retry').onclick=()=>{document.querySelector('#feedback').innerHTML='';document.querySelector('#status').textContent='La estación espera una nueva transmisión.'}}
function bindPTT(){const p=document.querySelector('#ptt'),status=document.querySelector('#status'),heard=document.querySelector('#heard');let rec=null,holding=false,alternatives=[];const start=async e=>{e.preventDefault();holding=true;p.classList.add('live');alternatives=[];heard.textContent='Escuchando…';try{if(!SR)throw Error('Reconocimiento de voz no disponible');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(x=>x.stop());if(!holding)return;rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=5;rec.onstart=()=>status.textContent='● TRANSMITIENDO';rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const rr=e.results[i];if(rr.isFinal){for(let j=0;j<rr.length;j++)alternatives.push(rr[j].transcript)}else heard.textContent=rr[0].transcript||'Escuchando…'};rec.onerror=e=>status.textContent='Radio: '+e.error;rec.onend=()=>{p.classList.remove('live');const unique=[...new Set(alternatives.map(x=>x.trim()).filter(Boolean))];if(unique.length)evaluate(unique);else{status.textContent='No se comprendió. Vuelve a transmitir.';say('Última estación, repita.')}};rec.start()}catch(err){p.classList.remove('live');status.textContent=err.message}};const stop=e=>{e.preventDefault();holding=false;p.classList.remove('live');try{rec&&rec.stop()}catch{}};p.addEventListener('pointerdown',start);p.addEventListener('pointerup',stop);p.addEventListener('pointercancel',stop)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.92;speechSynthesis.speak(u)}catch{}}
function finish(){const pct=Math.round(state.score/(state.score+state.errors||1)*100),grade=pct>=90?'Excelente':pct>=75?'Apto con práctica':'Repite el circuito';app.innerHTML='<section class="card"><h2 class="good">Circuito completado</h2><p><b>'+grade+'</b> · eficacia '+pct+'% · '+state.score+' comunicaciones aceptadas · '+state.errors+' correcciones.</p><p>Los errores no penalizan el aprendizaje: quedan registrados para saber qué practicar.</p><button class="btn primary" id="again">Repetir circuito</button><button class="btn" id="home">Academia</button></section><section class="card"><h3>Libro de comunicaciones</h3>'+state.history.map(x=>'<p><b>'+x.title+'</b> · '+x.outcome+' · intento '+x.attempt+'<br><small>'+x.text+'</small>'+(x.warnings||[]).map(w=>'<br><small class="warn">⚠ '+w+'</small>').join('')+'</p>').join('')+'</section>';document.querySelector('#again').onclick=()=>{state={turn:0,shortAuthorized:false,attempts:0,score:0,errors:0,history:[]};render()};document.querySelector('#home').onclick=menu}menu();</script></body></html>
