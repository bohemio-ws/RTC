name: RTC Academy - integración verificable
on:
  push:
    branches: [refactor/modular-rtc]
  workflow_dispatch:
jobs:
  static-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis de todos los módulos
        run: |
          set -e
          for f in modular/*.js; do node --check "$f"; done
      - name: Ejecutar pruebas de integración de biblioteca y ASR
        run: node modular/tests/integration.js
      - name: Comprobar contrato sin servicios de voz remotos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('modular/asr-local.js').read_text()
          w=Path('modular/whisper-engine.js').read_text()
          p=Path('modular/audio-ptt.js').read_text()
          assert 'allowRemoteModels=false' in w
          assert 'rtcLocalASR.transcribe(blob,localEngine)' in p
          assert 'submit(res.text)' in p
          assert 'engine.local!==true' in a
          print('Contrato local y evaluación automática: estructura verificada')
          PY
      - name: Instalar dependencias locales y modelo Whisper
        run: bash scripts/install-offline-asr.sh
      - name: Comprobar que todos los recursos locales existen
        run: |
          test -s modular/vendor/transformers.min.js
          find modular/vendor -name '*.wasm' -size +0c | grep -q .
          find modular/models/Xenova/whisper-tiny/onnx -name '*.onnx' -size +0c | grep -q .
      - name: Empaquetar versión de prueba (NO publicación)
        run: tar -czf rtc-academy-candidate.tar.gz modular
      - uses: actions/upload-artifact@v4
        with:
          name: rtc-academy-candidate
          path: rtc-academy-candidate.tar.gz
          retention-days: 7
