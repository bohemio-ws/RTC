name: RTC clean architecture rebuild
on:
  push:
    paths:
      - '.github/workflows/rtc-clean-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild single-app RTC core
        run: |
          echo '' | base64 -d > /tmp/rebuild.py
          python3 /tmp/rebuild.py
      - name: Verify architecture
        run: |
          echo '' | base64 -d > /tmp/verify.py
          python3 /tmp/verify.py
      - name: Commit rebuilt app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtc-v059.html index.html
          git commit -m "Rebuild RTC as single-app hold-to-talk architecture" || exit 0
          git push
