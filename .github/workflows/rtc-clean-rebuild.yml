name: RTC ASR audit cleanup
on:
  push:
    paths:
      - '.github/workflows/rtc-clean-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct ASR output in clean core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html','rtc-v059.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              old='function render(text){currentText=String(text||"").trim();onWords(currentText)}'
              new='''function rtcCleanASR(text){
 let x=String(text||"").replace(/\\b(?:UMH|UMM|MMM)\\b/gi," QNH ").replace(/\\s+/g," ").trim();
 let prev="";
 while(x!==prev){prev=x;x=x.replace(/\\b((?:[^\\s]+\\s+){0,3}[^\\s]+)(?:\\s+\\1\\b)+/gi,"$1").replace(/\\s+/g," ").trim()}
 return x;
}
function render(text){currentText=rtcCleanASR(text);onWords(currentText)}'''
              if old not in s: raise SystemExit(name+': render target not found')
              s=s.replace(old,new,1)
              s=s.replace('VERSIÓN 0.67 · 20 OCT 2026 · EC-RTC','VERSIÓN 0.68 · 20 OCT 2026 · EC-RTC')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify clean architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          b=s[s.index('function rtcHoldRecognizer('):s.index('function numberIssues(')]
          assert '<iframe' not in s
          assert 'MediaRecorder' not in b
          assert 'rtcPTTToggle' not in b
          assert 'rtcCleanASR' in b
          assert 'drillCheck(t)' in b
          print('RTC v0.68 checks passed')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rtc-v059.html
          git commit -m "Clean RTC repeated ASR transcript" || exit 0
          git push
