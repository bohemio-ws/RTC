<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>RTC Academy · Simulador integrado v0.20</title><style>
:root{color-scheme:dark;--bg:#071426;--panel:#10263c;--line:#34536c;--txt:#edf5fa;--dim:#b3c5d1;--red:#d52e36;--green:#6de0aa;--yellow:#f4c65c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif;padding-bottom:45px}header{padding:14px 18px;border-bottom:1px solid var(--line);background:#0b1e31;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}h2{font-size:21px;margin:4px 0 12px}h3{font-size:17px}small,.muted{color:var(--dim)}main{max-width:860px;margin:auto;padding:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn,select,input{font:inherit;color:var(--txt);background:#193852;border:1px solid #4b6d86;border-radius:10px;padding:12px}.btn{cursor:pointer;min-height:45px}.primary{background:#bd2631;border-color:#e55359}.good{color:var(--green)}.bad{color:#ff7777}.warn{color:var(--yellow)}.ptt{display:block;margin:14px auto;border-radius:50%;width:150px;height:150px;border:6px solid #8b161f;background:#d6303b;color:white;font-size:21px;font-weight:800;touch-action:none}.ptt.live{box-shadow:0 0 0 12px #e13b3b33}.radio{padding:12px;background:#06101e;border:1px solid var(--line);border-radius:9px;margin:9px 0}.bar{height:8px;background:#091b2a;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:#49b6c3;transition:width .4s}.line{padding:7px 0;border-bottom:1px solid #35516a}.map{width:100%;height:auto;display:block;background:#0c2736;border-radius:12px;border:1px solid #3b6175}.tag{display:inline-block;background:#24455e;padding:5px 9px;border-radius:18px;font-size:12px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice .btn{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.k{color:#ff8581;font-size:12px;letter-spacing:.1em;font-weight:bold}.feedback{border-left:4px solid #f1bb59}.flight{color:#7de1ee;font-weight:bold}textarea{width:100%;min-height:72px;background:#071827;border:1px solid #42627b;border-radius:9px;color:white;padding:10px;font:inherit}label{display:block;margin:8px 0 5px}select{width:100%}@media(max-width:500px){.grid{grid-template-columns:1fr}header{align-items:flex-start}.ptt{width:140px;height:140px}}
</style></head><body><header><div><small>BOHEMIO 4∞ · ACADEMY</small><h1>RTC · Entrenador visual</h1></div><small>v0.20 · INTEGRACIÓN</small></header><main id="app"></main><script>
"use strict";
const $=s=>document.querySelector(s), app=$("#app"), SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const fields=[
{id:"N",name:"Academia Norte",rwy:"06/24",heading:60,service:"AUTOINFO",exit:"W",freq:"SIM-N"},
{id:"S",name:"Academia Sur",rwy:"18/36",heading:180,service:"TORRE SIMULADA",exit:"E",freq:"SIM-S"},
{id:"E",name:"Academia Este",rwy:"09/27",heading:90,service:"AFIS SIMULADO",exit:"N",freq:"SIM-E"},
{id:"O",name:"Academia Oeste",rwy:"12/30",heading:120,service:"AUTOINFO",exit:"S",freq:"SIM-O"}];
const exercises=[
{id:"short",title:"1 · Pruebas cortas",desc:"Llamadas aisladas, posiciones e intenciones.",phases:["platform","hold","lineup","departure"]},
{id:"long",title:"2 · Pruebas largas",desc:"Secuencia continua y comunicaciones encadenadas.",phases:["platform","taxi","hold","lineup","departure","upwind","crosswind","downwind","base","final","landing","parking"]},
{id:"emergency",title:"3 · Emergencias",desc:"Situaciones de urgencia, socorro y fallo de comunicaciones.",phases:["departure","upwind","emergency","divert","approach"]},
{id:"circuit",title:"4 · Despegue y aproximación",desc:"Avión automático, llamadas oportunas y circuito completo.",phases:["platform","taxi","hold","lineup","departure","upwind","crosswind","downwind","base","final","landing","parking"]},
{id:"exam",title:"5 · Examen final A → B → A",desc:"Dos etapas completas, dos aeródromos y evaluación global.",phases:[]}];
const phases={
platform:["Plataforma","Antes de iniciar el movimiento, comunica tu posición e intención.",["station","callsign","position","intent"]],
taxi:["Rodaje","La aeronave se desplaza automáticamente. Comunica el movimiento si corresponde al procedimiento.",["callsign","intent"]],
hold:["Punto de espera","El avión está detenido en el punto de espera. Escucha y comunica según el servicio.",["station","callsign","position","intent"]],
lineup:["Entrada en pista","Comprueba si se necesita autorización de entrada en pista. No inventes autorizaciones.",["callsign","intent","runway"]],
departure:["Despegue","La aeronave inicia la carrera y despega cuando las condiciones simuladas lo permiten.",["callsign","intent","runway"]],
upwind:["Ascenso inicial","El avión asciende automáticamente. Vigila cuándo corresponde informar.",["callsign","position","intent"]],
crosswind:["Viento cruzado","El avión vira al tramo de viento cruzado.",["callsign","position"]],
downwind:["Viento en cola","El avión se establece en viento en cola.",["callsign","position","intent"]],
base:["Base","El avión vira a base. Es el momento de identificar y comunicar el tramo cuando proceda.",["callsign","position"]],
final:["Final","El avión se alinea con la pista y comienza la aproximación.",["callsign","position","runway"]],
landing:["Aterrizaje","El avión toma tierra. La fase no representa una autorización implícita.",["callsign","intent"]],
parking:["Estacionamiento","El avión queda detenido. Fin de etapa.",["callsign","position"]],
exit:["Abandono por punto de notificación","El avión abandona el circuito hacia el punto publicado o ficticio del ejercicio.",["callsign","position","intent"]],
enroute:["En ruta","El avión mantiene rumbo hacia el destino. Debes comunicar posición e intención cuando proceda.",["callsign","position","intent"]],
arrival:["Llegada","El avión se aproxima al aeródromo de destino y prepara la incorporación.",["station","callsign","position","intent"]],
emergency:["Incidencia en vuelo","Se simula pérdida de potencia. Evalúa la gravedad y comunica una prioridad justificada.",["signal","callsign","nature","position","intent"]],
divert:["Desvío","La aeronave se dirige automáticamente a una alternativa simulada.",["callsign","position","intent"]],
approach:["Aproximación de emergencia","El avión realiza una aproximación de emergencia simulada.",["callsign","position","intent"]]};
const route=["platform","taxi","hold","lineup","departure","upwind","exit","enroute","arrival","downwind","base","final","landing","parking"];
let st={mode:null,from:fields[0],to:fields[1],leg:0,step:0,steps:[],scores:[],events:[],transcript:"",done:false,waiting:false,rec:null,recFinal:"",error:"",micBusy:false};
function safe(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(t){return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,;:!?-]/g," ").replace(/\s+/g," ").trim()}
function say(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=.93;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase()==="es-es")||vs.find(x=>x.lang.startsWith("es"));if(v)u.voice=v;speechSynthesis.speak(u)}
function menu(){st.done=false;app.innerHTML='<section class="card"><div class="k">MÉTODO BOHEMIO ACADEMY</div><h2>Escucha · observa · transmite</h2><p>El avión vuela solo. Tú eres responsable de la radio, del momento de transmitir y de comprender la situación.</p><p class="warn">Todos los aeródromos, puntos y frecuencias de este módulo son FICTICIOS. No apto para navegación real.</p></section><div class="grid">'+exercises.map(e=>'<button class="btn" data-mode="'+e.id+'"><b>'+e.title+'</b><br><small>'+e.desc+'</small></button>').join("")+'</div><section class="card"><b>Configuración</b><label>Aeródromo A</label><select id="from">'+fields.map(f=>'<option value="'+f.id+'">'+f.name+' · '+f.rwy+' · '+f.service+'</option>').join("")+'</select><label>Aeródromo B (distinto)</label><select id="to">'+fields.map(f=>'<option value="'+f.id+'">'+f.name+' · '+f.rwy+' · '+f.service+'</option>').join("")+'</select><p class="muted">El examen final exige completar A → B → A, incluyendo las dos salidas y las dos llegadas.</p></section>';$("#to").value="S";document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>begin(b.dataset.mode))}
function begin(id){const a=fields.find(f=>f.id===$("#from").value),b=fields.find(f=>f.id===$("#to").value);if(a.id===b.id){alert("Selecciona dos aeródromos diferentes.");return}st={...st,mode:id,from:a,to:b,leg:0,step:0,steps:id==="exam"?route.slice():exercises.find(x=>x.id===id).phases.slice(),scores:[],events:[],done:false,waiting:false,transcript:"",error:""};draw()}
function activeField(){return st.leg===0?st.from:st.to}
function targetField(){return st.leg===0?st.to:st.from}
function phase(){return st.steps[st.step]}
function mapSVG(){const f=activeField(),p=phase(),idx=st.step;const coords={platform:[42,190],taxi:[95,183],hold:[118,175],lineup:[155,170],departure:[155,125],upwind:[155,68],crosswind:[222,56],downwind:[258,120],base:[258,185],final:[155,208],landing:[155,160],parking:[42,190],exit:[220,35],enroute:[280,42],arrival:[290,130],emergency:[250,70],divert:[220,80],approach:[155,207]};const xy=coords[p]||[155,130];const runwayAngle=f.heading-0;return '<svg class="map" viewBox="0 0 330 235" role="img" aria-label="Mapa esquemático de pista, circuito y posición de aeronave"><rect width="330" height="235" rx="10" fill="#102a3a"/><path d="M42 190 L95 183 L118 175 L155 170" fill="none" stroke="#d8c477" stroke-width="5"/><path d="M155 60 L258 60 L258 208 L155 208" fill="none" stroke="#51b8c7" stroke-dasharray="6 5" stroke-width="2"/><g transform="rotate('+runwayAngle+' 155 135)"><rect x="144" y="67" width="22" height="136" fill="#627681" stroke="#c8dce4"/><path d="M155 73 V195" stroke="#fff" stroke-width="2" stroke-dasharray="8 7"/></g><rect x="15" y="174" width="64" height="37" rx="5" fill="#255367"/><text x="47" y="190" text-anchor="middle" fill="white" font-size="10">Plataforma</text><text x="47" y="202" text-anchor="middle" fill="white" font-size="9">PARK</text><circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="14" fill="#eebc55" stroke="#fff" stroke-width="2"/><text x="'+xy[0]+'" y="'+(xy[1]+5)+'" text-anchor="middle" fill="#081523" font-size="16">✈</text><text x="10" y="20" fill="#d6ecf4" font-size="11">N ↑ · '+f.name+'</text><text x="10" y="32" fill="#bdd0d8" font-size="10">Pista '+f.rwy+' · esquema NO GEOGRÁFICO</text><text x="318" y="221" text-anchor="end" fill="#9bdfe8" font-size="11">Fase '+(idx+1)+'/'+st.steps.length+'</text></svg>'}
function draw(){if(st.step>=st.steps.length){if(st.mode==="exam"&&st.leg===0){st.leg=1;st.step=0;st.steps=route.slice();st.events.push("Etapa A → B terminada. Comienza regreso B → A.");draw();return}finish();return}const p=phase(),info=phases[p],f=activeField(),dest=targetField(),percent=Math.round(st.step/st.steps.length*100);st.waiting=true;st.transcript="";st.error="";app.innerHTML='<div class="row"><button class="btn" id="back">← Menú</button><span class="tag">'+safe(exercises.find(x=>x.id===st.mode).title)+'</span></div><section class="card"><div class="k">ESCENARIO FICTICIO · SOLO ENTRENAMIENTO</div><h2>'+safe(info[0])+'</h2><div class="row"><span>Origen: <b>'+safe(f.name)+'</b></span><span>Destino: <b>'+safe(dest.name)+'</b></span></div><p class="muted">Etapa '+(st.leg+1)+(st.mode==="exam"?"/2":"")+' · '+(st.step+1)+' de '+st.steps.length+'</p><div class="bar"><i style="width:'+percent+'%"></i></div><div style="margin-top:12px">'+mapSVG()+'</div><p>'+safe(info[1])+'</p><p class="muted">Servicio: '+safe(f.service)+' · Pistas '+f.rwy+' · Punto salida '+f.exit+' · Frecuencia FICTICIA '+f.freq+'</p></section><section class="card"><div class="k">TU TURNO DE RADIO</div><p>Observa la fase y transmite cuando corresponda. La estación de respuesta depende del servicio simulado.</p><button id="ptt" class="ptt">MANTENER<br>PTT</button><div id="status" class="muted">Pulsa PTT y habla; suelta al terminar.</div><div id="out" class="radio">La transcripción aparecerá aquí.</div><div class="choice"><button class="btn" id="manualBtn">⌨ Escribir</button><button class="btn" id="skip">Continuar sin transmitir</button></div><div id="manualArea"></div><div id="feedback"></div></section>';$("#back").onclick=()=>{try{st.rec?.abort()}catch{}menu()};$("#manualBtn").onclick=()=>{$("#manualArea").innerHTML='<textarea id="manualText" placeholder="Escribe la comunicación para probar el evaluador"></textarea><button class="btn primary" id="manualSend">Evaluar texto</button>';$("#manualSend").onclick=()=>evaluate($("#manualText").value)};$("#skip").onclick=()=>evaluate("",true);bindPTT()}
function slots(text){const n=norm(text),f=activeField();const vals={station:/\b(torre|control|informacion|radio|trafico|afis)\b/.test(n)||n.includes(norm(f.name)),callsign:/\bbohemi[oa]\s*(uno|1)\b/.test(n)||/\bec\s*[a-z]{2,5}\b/.test(n),position:/\b(plataforma|rodaje|espera|pista|viento|cola|base|final|vertical|millas?|kilometros?|pies|norte|sur|este|oeste|whisky|punto|ascenso)\b/.test(n),intent:/\b(solicit|salid|despeg|aterr|incorpor|rodaj|abandon|notific|entr|continu|frustr|desvi|regres|dirig|proced|emerg|manten)\w*/.test(n),runway:/\b(pista|06|24|18|36|09|27|12|30|dos|seis|ocho|nueve|uno|tres|cero)\b/.test(n),signal:/\b(mayday|may day|pan pan|panpan)\b/.test(n),nature:/\b(motor|potencia|humo|fuego|combustible|averia|fallo|emergencia|problema)\b/.test(n)};return vals}
function evaluate(t,skipped=false){if(!st.waiting)return;st.waiting=false;try{st.rec?.stop()}catch{}const text=String(t).trim(),need=phases[phase()][2],v=slots(text),missing=need.filter(k=>!v[k]),score=skipped?0:Math.round((need.length-missing.length)/need.length*100),critical=phase()==="emergency"&&!v.signal,station=activeField().service,phrase=text.toLowerCase();let notes=[];if(skipped)notes.push("No se ha transmitido en la fase solicitada.");if(missing.length)notes.push("Elementos no detectados: "+missing.map(k=>({station:"estación",callsign:"indicativo",position:"posición",intent:"intención",runway:"pista",signal:"prioridad",nature:"naturaleza de la incidencia"}[k])).join(", "));if(station==="AUTOINFO"&&/\b(autorizado|autorice|permiso concedido)\b/i.test(text))notes.push("Autoinformación: ninguna aeronave puede conceder autorización ATC.");if(phase()==="emergency"&&!v.signal)notes.push("CRÍTICO: debes decidir y comunicar la prioridad adecuada según la gravedad.");if(phase()==="hold"&&station.includes("TORRE")&&!/autoriz/i.test(text))notes.push("La autorización ATS es condición del escenario; no se presume por el mero avance visual.");if(/roger/i.test(text))notes.push("Revisar fraseología española: evitar importar expresiones estadounidenses sin contexto.");if(score===100)notes.push("Elementos detectados. Esto NO certifica exactitud de valores ni corrección normativa.");const reply=skipped?"No se ha recibido transmisión.":missing.length?"Bohemio Uno, revise: "+missing.map(k=>({station:"estación",callsign:"indicativo",position:"posición",intent:"intención",runway:"pista",signal:"prioridad",nature:"naturaleza de la incidencia"}[k])).join(", ")+".":station==="AUTOINFO"?"Tráfico simulado recibido. Continúe atento a las demás aeronaves.":"Bohemio Uno, recibido. Continúe con la siguiente fase simulada.";st.scores.push({leg:st.leg,phase:phase(),score,critical,text,notes});st.events.push("Etapa "+(st.leg+1)+" · "+phases[phase()][0]+": "+score+"%");$("#feedback").innerHTML='<div class="card feedback"><h3>Evaluación provisional: '+score+' %</h3><p>'+safe(text||"Sin transmisión")+'</p>'+notes.map(x=>'<div class="line">'+safe(x)+'</div>').join("")+'<div class="radio"><b>Respuesta simulada:</b> '+safe(reply)+'</div><div class="choice"><button class="btn" id="repeat">🔊 Escuchar</button><button class="btn primary" id="next">Continuar vuelo →</button></div></div>';$("#next").onclick=()=>{st.step++;draw()};$("#repeat").onclick=()=>say(reply);say(reply)}
function bindPTT(){const p=$("#ptt"),out=$("#out"),status=$("#status");let holding=false,rec=null,finalText="";const start=async e=>{e.preventDefault();if(!st.waiting)return;holding=true;p.classList.add("live");out.textContent="Escuchando…";status.textContent="Preparando micrófono…";try{if(!SR)throw Error("Reconocimiento no disponible");const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());if(!holding)return;rec=new SR();st.rec=rec;rec.lang="es-ES";rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;rec.onstart=()=>status.textContent="● TRANSMITIENDO";rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+" ";else interim+=e.results[i][0].transcript}out.textContent=(finalText+interim).trim()||"Escuchando…"};rec.onerror=e=>status.textContent="Error de reconocimiento: "+e.error;rec.onend=()=>{p.classList.remove("live");if(st.waiting){const t=out.textContent;if(t&&t!=="Escuchando…"&&t!=="La transcripción aparecerá aquí.")evaluate(t);else status.textContent="No se reconoció voz. Repite o escribe."}};rec.start()}catch(err){p.classList.remove("live");status.textContent="Micrófono: "+err.message}};const stop=e=>{e.preventDefault();holding=false;p.classList.remove("live");try{rec?.stop()}catch{}};p.addEventListener("pointerdown",start);p.addEventListener("pointerup",stop);p.addEventListener("pointercancel",stop)}
function finish(){const avg=st.scores.length?Math.round(st.scores.reduce((a,b)=>a+b.score,0)/st.scores.length):0,crit=st.scores.filter(x=>x.critical).length,passed=avg>=85&&!crit;app.innerHTML='<section class="card"><div class="k">INFORME FINAL · '+safe(exercises.find(x=>x.id===st.mode).title)+'</div><h2>'+(passed?"Ejercicio completado":"Ejercicio para revisar")+'</h2><h2 class="'+(passed?"good":"warn")+'">'+avg+' %</h2><p>'+st.scores.length+' comunicaciones · '+crit+' omisiones críticas detectadas</p><p class="warn">Resultado didáctico provisional: el evaluador aún no certifica exactitud de QNH, pista, indicativo ni conformidad normativa completa.</p><h3>Historial de comunicaciones</h3>'+st.scores.map(x=>'<div class="line">Etapa '+(x.leg+1)+' · '+safe(phases[x.phase][0])+' · '+x.score+'%<br><small>'+safe(x.text||"Sin transmisión")+'</small></div>').join("")+'<button class="btn primary" id="restart">Nuevo ejercicio</button></section>';$("#restart").onclick=menu}
menu();
</script></body></html>
