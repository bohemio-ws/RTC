<!doctype html><html lang="es"><meta charset="utf-8"><title>RTC Academy · Pruebas del PTT</title><style>body{font:16px system-ui;max-width:750px;margin:2rem auto;padding:1rem}pre{white-space:pre-wrap}button{padding:1rem} .live{background:#fbb}</style>
<h1>Pruebas automatizadas del PTT (dobles de navegador)</h1><p>Estas pruebas no sustituyen la verificación con micrófono real ni comprueban la precisión de transcripción.</p><pre id="log">Preparando…</pre><div id="testbed"></div>
<script>
"use strict";
const log=document.querySelector("#log"),bed=document.querySelector("#testbed");
function rtcPTTGuard(p){p.textContent="PTT";p.setAttribute("type","button")}
let errors=[],passes=0;
function assert(x,msg){if(!x)throw Error(msg);passes++}
function delay(t=0){return new Promise(r=>setTimeout(r,t))}
async function test(name,fn){try{await fn();log.textContent+="✔ "+name+"\n"}catch(e){errors.push(name+": "+e.message);log.textContent+="✘ "+name+": "+e.message+"\n"}}
let pending=null,tracks=0,starts=0,stops=0,blobs=0;
class FakeRecorder{
 constructor(stream){this.stream=stream;this.state="inactive";this.mimeType="audio/webm"}
 static isTypeSupported(){return true}
 start(){starts++;this.state="recording"}
 stop(){stops++;this.state="inactive";this.ondataavailable?.({data:new Blob(["voz"])});this.onstop?.()}
}
const original={mediaDevices:navigator.mediaDevices,MediaRecorder:window.MediaRecorder,create:URL.createObjectURL,revoke:URL.revokeObjectURL};
Object.defineProperty(navigator,"mediaDevices",{configurable:true,value:{getUserMedia:()=>pending?pending.promise:Promise.resolve({getTracks:()=>[{stop(){tracks++}}]})}});
window.MediaRecorder=FakeRecorder;URL.createObjectURL=()=>{blobs++;return "blob:rtc-test"};URL.revokeObjectURL=()=>{};
function mount(){bed.innerHTML='<button id="ptt">PTT</button><div id="status"></div>';return [bed.querySelector("#ptt"),bed.querySelector("#status")]}
function tap(p){p.click()}
function deferred(){let resolve;const promise=new Promise(r=>resolve=r);return {promise,resolve}}
</script>
<script src="../audio-ptt.js"></script>
<script>
(async()=>{
 log.textContent="";let p,status,controller;
 await test("Inicio, pausa sin finalización automática y fin solo por orden",async()=>{
  [p,status]=mount();controller=rtcHoldRecognizer(p,status,()=>{},()=>{});tap(p);await delay();assert(controller.getState()==="recording","no comienza");
  await delay(60);assert(controller.getState()==="recording","se interrumpe sin orden");tap(p);await delay();
  assert(controller.getState()==="idle","no termina");assert(bed.querySelector("audio"),"falta audio reproducible");controller.dispose();
 });
 await test("Un pointerdown aislado no activa el modo alterno",async()=>{
  [p,status]=mount();controller=rtcHoldRecognizer(p,status,()=>{},()=>{});
  p.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerType:"touch",button:0}));
  await delay();assert(controller.getState()==="idle","pointerdown inició grabación sin click");controller.dispose();
 });
 await test("Cancelar mientras solicita permiso",async()=>{
  pending=deferred();[p,status]=mount();controller=rtcHoldRecognizer(p,status,()=>{},()=>{});
  tap(p);assert(controller.getState()==="requesting","no pide permiso");tap(p);assert(controller.getState()==="idle","no cancela");
  pending.resolve({getTracks:()=>[{stop(){tracks++}}]});await delay();
  assert(controller.getState()==="idle","grabación tardía inesperada");controller.dispose();pending=null;
 });
 await test("Salir de pantalla con permiso pendiente",async()=>{
  pending=deferred();[p,status]=mount();controller=rtcHoldRecognizer(p,status,()=>{},()=>{});tap(p);controller.dispose();
  pending.resolve({getTracks:()=>[{stop(){tracks++}}]});await delay();
  assert(controller.getState()==="idle","estado inesperado");pending=null;
 });
 await test("Liberar micrófono al salir de pantalla",async()=>{
  [p,status]=mount();controller=rtcHoldRecognizer(p,status,()=>{},()=>{});tap(p);await delay();const old=tracks;
  controller.dispose();assert(tracks>old,"no libera micrófono");
 });
 log.textContent+="\n"+passes+" verificaciones · "+errors.length+" fallos.\n";
 if(errors.length)log.textContent+=errors.join("\n");
})();
</script></html>
