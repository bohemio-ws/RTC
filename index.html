<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><title>RTC · Prueba MICRO/PTT</title><style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#f5f8fc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}main{max-width:720px;margin:auto;padding:20px}.brand{font-size:13px;letter-spacing:.15em;color:#ff8581}.card{background:#0d2037;border:1px solid #28435e;border-radius:18px;padding:18px;margin:14px 0}.ptt{width:180px;height:180px;border-radius:50%;display:block;margin:24px auto;background:#c82025;border:7px solid #681014;color:#fff;font-size:22px;font-weight:900;touch-action:none}.ptt.live{transform:scale(.96);box-shadow:0 0 0 10px #e5393533}.status{padding:12px;border-radius:12px;background:#07111d;margin:10px 0}.ok{color:#55d994}.bad{color:#ff7772}.muted{color:#a9b8c9}.action{font:inherit;color:#fff;background:#102944;border:1px solid #35516b;border-radius:12px;padding:12px 14px;margin:5px}.transcript{min-height:70px;padding:12px;background:#050b12;border-radius:12px;border:1px solid #37506a;font-size:18px}</style></head><body><main><div class="brand">BOHEMIO ACADEMY</div><h1>RTC · Prueba de voz</h1><p class="muted">v0.11 HTTPS · 16/10/2026</p><section class="card"><h2>Diagnóstico</h2><div id="secure" class="status"></div><div id="media" class="status"></div><div id="speech" class="status"></div><div id="tts" class="status"></div><button class="action" id="permission">🎙 Probar permiso de micrófono</button><button class="action" id="audio">🔊 Probar audio</button></section><section class="card"><h2>PTT</h2><p class="muted">Mantén pulsado mientras hablas y suelta al terminar.</p><button id="ptt" class="ptt">MANTENER<br>PTT</button><div id="pttStatus" class="status">Preparado.</div><div id="out" class="transcript">La transcripción aparecerá aquí.</div></section></main><script>const $=s=>document.querySelector(s),SR=window.SpeechRecognition||window.webkitSpeechRecognition;function line(id,ok,a,b){$(id).className='status '+(ok?'ok':'bad');$(id).textContent=(ok?'✓ ':'✗ ')+(ok?a:b)}line('#secure',window.isSecureContext,'Contexto seguro HTTPS','No es un contexto seguro');line('#media',!!navigator.mediaDevices?.getUserMedia,'getUserMedia disponible','getUserMedia no disponible');line('#speech',!!SR,'Reconocimiento de voz disponible','Reconocimiento de voz no disponible');line('#tts','speechSynthesis'in window,'Salida de voz disponible','Salida de voz no disponible');async function mic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());$('#pttStatus').className='status ok';$('#pttStatus').textContent='✓ PERMISO DE MICRÓFONO CONCEDIDO';return true}catch(e){$('#pttStatus').className='status bad';$('#pttStatus').textContent='✗ Micrófono: '+(e.name||e.message);return false}}$('#permission').onclick=mic;$('#audio').onclick=()=>{if(!('speechSynthesis'in window))return; speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance('Afirma. Audio de RTC Bohemio Academy funcionando.');u.lang='es-ES';u.rate=.92;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang?.toLowerCase()==='es-es')||vs.find(x=>x.lang?.toLowerCase().startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)};let rec=null,finalText='';const p=$('#ptt'),st=$('#pttStatus'),out=$('#out');async function start(e){e.preventDefault();p.classList.add('live');finalText='';out.textContent='Escuchando…';if(!await mic()){p.classList.remove('live');return}if(!SR){st.textContent='Reconocimiento no disponible en este navegador.';p.classList.remove('live');return}rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;rec.onstart=()=>{st.className='status ok';st.textContent='● TRANSMITIENDO…'};rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}out.textContent=(finalText+interim).trim()||'Escuchando…'};rec.onerror=e=>{st.className='status bad';const m={'not-allowed':'Permiso de micrófono denegado','service-not-allowed':'Servicio de reconocimiento bloqueado','audio-capture':'No se puede capturar audio','no-speech':'No se detectó voz','network':'Error de red del reconocimiento','aborted':'Reconocimiento interrumpido'};st.textContent='✗ '+(m[e.error]||('Error: '+e.error))};rec.onend=()=>{p.classList.remove('live');if(!st.classList.contains('bad')){st.className='status ok';st.textContent=out.textContent&&out.textContent!=='Escuchando…'?'✓ TRANSMISIÓN RECIBIDA':'PTT finalizado'}};try{rec.start()}catch(e){st.className='status bad';st.textContent='✗ '+e.message}}function stop(e){e.preventDefault();p.classList.remove('live');try{rec?.stop()}catch(e){}}p.addEventListener('pointerdown',start);p.addEventListener('pointerup',stop);p.addEventListener('pointercancel',stop);</script></body></html>
