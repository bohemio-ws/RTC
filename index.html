<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><title>RTC Bohemio Academy · v0.13</title><style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#f5f8fc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header,main{max-width:760px;margin:auto;padding:16px}header{display:flex;align-items:center;gap:12px}.brand{font-size:28px;font-weight:900;color:#ff7772}.version{margin-left:auto;color:#9eb0c2;font-size:12px}.card{background:#0d2037;border:1px solid #28435e;border-radius:18px;padding:18px;margin:14px 0}.muted{color:#a9b8c9}.radio{background:#07111d;border-left:3px solid #d64b4b;padding:14px;border-radius:10px}.ptt{width:180px;height:180px;border-radius:50%;display:block;margin:24px auto;background:#c82025;border:7px solid #681014;color:#fff;font-size:22px;font-weight:900;touch-action:none}.ptt.live{transform:scale(.96);box-shadow:0 0 0 10px #e5393533}.status,.transcript{padding:12px;border-radius:12px;background:#07111d;margin:10px 0}.transcript{min-height:65px;border:1px solid #37506a;font-size:18px}.ok{color:#55d994}.warn{color:#f1c76b}.bad{color:#ff7772}.check{padding:7px 0}.action{font:inherit;color:#fff;background:#102944;border:1px solid #35516b;border-radius:12px;padding:12px 14px;margin:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">4∞</div><div><small>BOHEMIO ACADEMY</small><b>RTC · Radiofonía ULM</b></div><span class="version">v0.13 · VOZ HTTPS</span></header><main><section class="card"><h2>Prueba integrada RTC</h2><p class="muted">Ya no es un diagnóstico aislado: habla, el motor analiza los elementos operacionales y la dependencia responde por voz.</p><div class="grid"><button class="action" data-s="departure">🛫 Salida</button><button class="action" data-s="arrival">🛬 Llegada</button><button class="action" data-s="pan">⚠️ PAN PAN</button><button class="action" data-s="mayday">🆘 MAYDAY</button></div></section><div id="sim"></div></main><script>const $=s=>document.querySelector(s),SR=window.SpeechRecognition||window.webkitSpeechRecognition;const scenarios={departure:{title:'Salida y circuito',station:'TORRE / ATS',prompt:'Bohemio Uno, transmita.',required:['station','callsign','position','intention'],critical:[],keys:{station:['torre','informacion','radio'],callsign:['bohemio','uno'],position:['plataforma','espera','pista','rodaje'],intention:['solicito','salida','despegue','circuito','rodaje']}},arrival:{title:'Llegada e incorporación',station:'ATS / AFIS',prompt:'Bohemio Uno, adelante.',required:['station','callsign','position','intention'],critical:[],keys:{station:['torre','informacion','radio'],callsign:['bohemio','uno'],position:['millas','pies','norte','sur','este','oeste','vertical'],intention:['aterrizar','incorporar','entrada','circuito','toma']}},pan:{title:'Urgencia',station:'DEPENDENCIA',prompt:'Frecuencia activa.',required:['signal','callsign','nature','position','intention'],critical:['signal','position'],keys:{signal:['pan pan','panpan'],callsign:['bohemio','uno'],nature:['motor','combustible','averia','problema','urgencia'],position:['millas','pies','norte','sur','este','oeste','posicion'],intention:['aterrizar','desviar','regresar','dirigir']}},mayday:{title:'Peligro grave e inminente',station:'DEPENDENCIA',prompt:'Frecuencia activa.',required:['signal','callsign','nature','position','intention'],critical:['signal','position'],keys:{signal:['mayday'],callsign:['bohemio','uno'],nature:['motor','fuego','incendio','potencia','emergencia'],position:['millas','pies','norte','sur','este','oeste','posicion'],intention:['aterrizar','campo','toma','regresar']}}};let current=scenarios.departure,rec=null,finalText='';function norm(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.92;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang?.toLowerCase()==='es-es')||vs.find(x=>x.lang?.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}function render(s){current=s;$('#sim').innerHTML=`<section class="card"><h2>${s.title}</h2><div class="radio"><b>${s.station}:</b> ${s.prompt}</div><button id="ptt" class="ptt">MANTENER<br>PTT</button><div id="status" class="status">Mantén pulsado mientras transmites.</div><div id="out" class="transcript">Tu transmisión aparecerá aquí.</div><div id="feedback"></div></section>`;bind()}function evaluate(text){const n=norm(text),hits={};for(const k of current.required)hits[k]=(current.keys[k]||[]).some(x=>n.includes(norm(x)));if(current===scenarios.departure||current===scenarios.arrival){hits.station=hits.station||/\b(tarancon|camarenilla|trafico|autoinformacion)\b/.test(n);hits.callsign=hits.callsign||/\bbohemi[oa]\s*(uno|1)\b/.test(n)}let total=0,got=0;for(const k of current.required){const w=current.critical.includes(k)?2:1;total+=w;if(hits[k])got+=w}let score=Math.round(got/total*100);if(current.critical.some(k=>!hits[k]))score=Math.min(score,59);const label=score>=85?'CORRECTA':score>=60?'MEJORABLE':score>=35?'INCOMPLETA':'INCORRECTA';const names={station:'Estación llamada',callsign:'Indicativo',position:'Posición / nivel',intention:'Intención',signal:'Señal de prioridad',nature:'Naturaleza de la situación'};let reply;if(current===scenarios.mayday&&hits.signal)reply='Bohemio Uno, MAYDAY recibido. Continúe con posición, naturaleza del problema e intenciones.';else if(current===scenarios.pan&&hits.signal)reply='Bohemio Uno, PAN PAN recibido. Continúe con posición e intenciones.';else if(score>=85)reply='Bohemio Uno, recibido.';else reply='Bohemio Uno, faltan: '+current.required.filter(k=>!hits[k]).map(k=>names[k].toLowerCase()).join(', ')+'. Repita la transmisión.';$('#feedback').innerHTML=`<div class="card"><b>HAS TRANSMITIDO</b><p>“${text.replace(/[<>]/g,'')}”</p><h2 class="${score>=85?'ok':score>=60?'warn':'bad'}">${score}% · ${label}</h2>${current.required.map(k=>`<div class="check">${hits[k]?'✓':'○'} ${names[k]}</div>`).join('')}<div class="radio"><b>RESPUESTA:</b> ${reply}</div><button id="repeat" class="action">🔊 Repetir audio</button></div>`;$('#repeat').onclick=()=>speak(reply);setTimeout(()=>speak(reply),180)}async function ensureMic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());return true}catch(e){$('#status').textContent='Micrófono: '+(e.name||e.message);return false}}function bind(){const p=$('#ptt'),st=$('#status'),out=$('#out');async function start(e){e.preventDefault();p.classList.add('live');finalText='';out.textContent='Escuchando…';if(!await ensureMic()||!SR){p.classList.remove('live');return}rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;rec.onstart=()=>st.textContent='● TRANSMITIENDO…';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;e.results[i].isFinal?finalText+=t+' ':interim+=t}out.textContent=(finalText+interim).trim()||'Escuchando…'};rec.onerror=e=>st.textContent='Error de reconocimiento: '+e.error;rec.onend=()=>{p.classList.remove('live');const t=out.textContent==='Escuchando…'?'':out.textContent;if(t){st.textContent='✓ TRANSMISIÓN RECIBIDA';evaluate(t)}};try{rec.start()}catch(e){st.textContent=e.message}}function stop(e){e.preventDefault();p.classList.remove('live');try{rec?.stop()}catch{}}p.addEventListener('pointerdown',start);p.addEventListener('pointerup',stop);p.addEventListener('pointercancel',stop)}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>render(scenarios[b.dataset.s]));render(current);</script></body></html>
