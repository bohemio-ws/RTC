<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07192b"><title>Alfabeto e indicativos · RTC Academy</title><link rel="icon" href="favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#07192b;color:#eef7ff;font-family:system-ui}.wrap{max-width:850px;margin:auto;padding:18px}.head{display:flex;gap:12px;align-items:center}.head img{width:58px;height:58px;border-radius:12px}.card{background:#10283d;border:1px solid #456b86;border-radius:16px;padding:18px;margin:12px 0}.gold{border-left:5px solid #e4ad50}.btn{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #77a9c9;background:#17344b;color:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.letter{padding:10px;background:#0a1d2e;border-radius:9px;text-align:center}.letter b{color:#62baf0;font-size:19px}.answer{font-size:24px;font-weight:800;text-align:center;padding:16px}.ok{color:#8ce3a8}.bad{color:#ff8b83}.back{display:block;text-align:center;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="head"><img src="logo-bohemio.jpg"><div><small>BOHEMIO 4 INFINITY · RTC ACADEMY</small><h1>🔤 Alfabeto e indicativos</h1></div></div><section class="card gold"><h2>Objetivo</h2><p>Convertir letras e indicativos en reflejos de radio. Escucha el indicativo y selecciona su forma fonética correcta.</p><button class="btn" id="listen">🔊 ESCUCHAR INDICATIVO</button><div id="question" class="answer">Preparando…</div><div id="options"></div><div id="feedback"></div><button class="btn" id="next">Siguiente indicativo</button></section><section class="card"><h2>Alfabeto aeronáutico</h2><div class="grid" id="alphabet"></div></section><section class="card"><h2>📊 Progreso</h2><div id="stats"></div></section><a class="btn back" href="mega.html">← RTC Mega</a></div><script>const A={A:'Alfa',B:'Bravo',C:'Charlie',D:'Delta',E:'Echo',F:'Foxtrot',G:'Golf',H:'Hotel',I:'India',J:'Juliett',K:'Kilo',L:'Lima',M:'Mike',N:'November',O:'Oscar',P:'Papa',Q:'Quebec',R:'Romeo',S:'Sierra',T:'Tango',U:'Uniform',V:'Victor',W:'Whiskey',X:'X-ray',Y:'Yankee',Z:'Zulu'};const calls=['EC-RTC','EC-ABC','EC-DLM','EC-FGS','EC-HVK','EC-JPR','EC-LTZ','EC-MNX','EC-PQA','EC-SUV'];let cur,ok=+(localStorage.rtcAlphaOk||0),tries=+(localStorage.rtcAlphaTries||0);function phon(c){return c.replace('EC-','').split('').map(x=>A[x]).join(' ')}function full(c){return 'Eco Charlie '+phon(c)}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replace(/Charlie/g,'Charli'));u.lang='es-ES';u.rate=.82;speechSynthesis.speak(u)}function shuffle(a){return a.sort(()=>Math.random()-.5)}function draw(){cur=calls[Math.floor(Math.random()*calls.length)];document.querySelector('#question').textContent='🎧 Identifica el indicativo';let wrong=shuffle(calls.filter(x=>x!==cur)).slice(0,2),opts=shuffle([cur,...wrong]);document.querySelector('#options').innerHTML=opts.map(x=>'<button class="btn choice" data-c="'+x+'">'+x+' · '+full(x)+'</button>').join('');document.querySelector('#feedback').innerHTML='';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.c));setTimeout(()=>speak(full(cur)),250)}function answer(x){tries++;localStorage.rtcAlphaTries=tries;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(x===cur){ok++;localStorage.rtcAlphaOk=ok;document.querySelector('#feedback').innerHTML='<p class="ok">✓ Correcto: <b>'+cur+'</b> · '+full(cur)+'</p>'}else document.querySelector('#feedback').innerHTML='<p class="bad">✗ Era <b>'+cur+'</b> · '+full(cur)+'</p>';stats()}function stats(){let p=tries?Math.round(ok/tries*100):0;document.querySelector('#stats').innerHTML='<b>'+ok+'</b> aciertos · <b>'+tries+'</b> intentos · <b>'+p+'%</b> precisión'}document.querySelector('#alphabet').innerHTML=Object.entries(A).map(([l,w])=>'<div class="letter"><b>'+l+'</b><br>'+w+'</div>').join('');document.querySelector('#listen').onclick=()=>speak(full(cur));document.querySelector('#next').onclick=draw;stats();draw();</script></body></html>
